# Exeris prose lint — ADR-085 §J.32 (warning level) and claims-and-evidence.md rule 4 (error level).
StylesPath = styles
MinAlertLevel = suggestion
# House words the spell checker must accept. A Vocab is added ahead of every style, so the
# vendored Quarkus Spelling filter stays untouched. See styles/config/vocabularies/Exeris/.
Vocab = Exeris

# Vendored Quarkus style (Apache-2.0) + Exeris terminology and retraction rules.
[*.md]
BasedOnStyles = Quarkus, Exeris
# Frontmatter, inline code, Javadoc inline tags and link targets are not prose.
BlockIgnores = (?s)^---\n.*?\n---\n
TokenIgnores = (\{@[a-z]+[^}]*\}), (`[^`]+`)
# Quarkus's user-docs-only rules are too strong for engineering notes: downgrade, don't drop.
Quarkus.TermsErrors = warning
Quarkus.SentenceLength = suggestion
Quarkus.Headings = suggestion
Quarkus.TermsWarnings = suggestion

# The registry and the claims file are data tables, not prose; standards and CLAUDE.md *quote* retracted
# figures as examples of what not to write.
[{**/adr-index.md,**/CLAIMS.md,**/CLAUDE.md,**/standards/**/*.md,**/standards/*.md}]
BasedOnStyles = Exeris
Exeris.RetractedFigures = NO
Exeris.DriftPatterns = NO

# Not prose. Mirrors the exclusion taxonomy in scripts/_common.py — keep the two in step:
#  - .guardrails/**: the bundle is checked out into the workspace it lints. Its own README quotes
#    retracted figures in order to report them; linting the linter is noise at best and, on an
#    error-level rule, a false failure.
#  - agent trees: instruction files written to a runtime's schema, not documentation. Inside
#    .github only the semantic subdirectories are skipped — CONTRIBUTING.md is prose.
#  - generated output and local-only drafts: nobody published them.
[{.guardrails/**,.agents/**,.claude/**,.codex/**,.cursor/**,.gemini/**,.clinerules/**,.github/agents/**,.github/prompts/**,.github/skills/**,.github/rules/**,.github/policies/**,.github/instructions/**,**/node_modules/**,**/target/**,**/build/**,**/dist/**,**/.docusaurus/**,**/local-only/**,**/memories/**,**/native-libs/**,**/third-party/**,**/3rdparty/**,**/vendor/**,**/_*/**}]
BasedOnStyles = ""
