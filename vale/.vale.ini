# Exeris prose lint — ADR-085 §J.32 (warning level) and claims-and-evidence.md rule 4 (error level).
StylesPath = styles
MinAlertLevel = suggestion

# Vendored Quarkus style (Apache-2.0) + Exeris terminology and retraction rules.
[*.md]
BasedOnStyles = Quarkus, Exeris
# Frontmatter, inline code, Javadoc inline tags and link targets are not prose.
BlockIgnores = (?s)^---\n.*?\n---\n
TokenIgnores = (\{@[a-z]+[^}]*\}), (`[^`]+`)
# Quarkus's user-docs-only rules are too strong for engineering notes: downgrade, don't drop.
Quarkus.TermsErrors = warning
Quarkus.SentenceLength = suggestion
Quarkus.Headings = suggestion
Quarkus.TermsWarnings = suggestion

# The registry and the claims file are data tables, not prose; standards and CLAUDE.md *quote* retracted
# figures as examples of what not to write.
[{**/adr-index.md,**/CLAIMS.md,**/CLAUDE.md,**/standards/**/*.md,**/standards/*.md}]
BasedOnStyles = Exeris
Exeris.RetractedFigures = NO
Exeris.DriftPatterns = NO
