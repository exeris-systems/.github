# The organisation repository runs its own gates. It defines them for every other repo (ADR-085 §C.11)
# and until now was the one repo they never ran on: its two review-routine documents carried no
# frontmatter and nothing noticed. A gate its owner does not run is a gate nobody has tested.
#
# It calls the reusable workflows by relative path, so a pull request is checked against the version
# in the pull request — not against @main, which would test the wrong code.
name: guardrails
on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review, labeled, unlabeled]
concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  # Not `true`. The publishing half removes the review label when it is done, and that removal is an
  # `unlabeled` event that starts a second run — which under a plain `cancel-in-progress: true`
  # cancels the run still finishing the publication that triggered it. Measured on #35: the
  # publishing run's last job completed at 07:06:26 and the bot's run was created at 07:06:26. Every
  # job came out `success` and the run-level conclusion was still `cancelled`; a review ten seconds
  # slower would have had its `publish / verdict` job cancelled instead, and a cancelled required
  # check blocks the pull request for a reason no human can act on.
  #
  # So a bot-triggered run never cancels — it queues and runs after, which also serialises the two
  # runs that would otherwise write the same comment. Human pushes still collapse, which is what the
  # setting is for: the cost of a burst is paid by the person making it.
  cancel-in-progress: ${{ !endsWith(github.actor, '[bot]') }}
permissions:
  contents: read
  pull-requests: read
  # The union the docs-review job's chain declares, which `caller_permissions_check.py` now verifies
  # by walking the nested call rather than stopping at the first level. `issues: read` lets the
  # routine see the debt issues of issue-conventions.md rule 6; `id-token: write` is the runner
  # action's own token exchange. Neither job writes with them — every write goes through the App.
  issues: read
  id-token: write

jobs:
  # The L2 review this repository makes mandatory for every other one, run on this repository. Its
  # absence was the plainest contradiction in the file: the header above says "A gate its owner does
  # not run is a gate nobody has tested", and this was the gate.
  #
  # `publish: true` HERE AND NOWHERE ELSE YET. The publishing half is opt-in precisely so that this
  # repository can answer ADR-087 Engineering Protocol 4 on its own pull requests before anyone
  # else's depend on the answers: whether `claude-code-action` can write `verdict.json`, and what
  # identity it posts under. Both are unknown, so this job is EXPECTED to be able to go red on the
  # no-verdict path — that red is the measurement, and it blocks nothing, because no check here is
  # required. A caller turns publication on once the answers exist.
  #
  # `verdict-authors` is not passed and stays empty, which keeps §B.10's fenced fallback off: the
  # only identity it could otherwise trust is one every workflow in this repository can write under.
  # It gets a value, through a new `docs-review.yml` input, when a run has shown what that value is.
  #
  # The relative path checks this pull request's `docs-review.yml`. The publishing half still comes
  # from `@main` — a reusable workflow cannot name another by relative path — so this run tests the
  # producing half as proposed and the deciding half as released. That limit is named in
  # `publish-verdict.yml`'s own header and is not closed here.
  docs-review:
    # WAITS ON THE L1 GATES, and that is an ordering decision rather than a dependency. A review is
    # the layer that judges what the gates cannot, so running it on a pull request whose commit
    # message does not lint spends eight minutes of a model to say something a script already said.
    # And a gate that has finished is a gate whose result can be HANDED to the reviewer, which is the
    # whole of `l1-results`: the first real run reported all three as `not-run` because its harness
    # denies network calls, and the required check was red for a reason that had nothing to do with
    # the pull request.
    #
    # `always()` so the publish half still reports when a gate failed: the produce job skips itself
    # on the results below, and the publish half turns that into a red naming the failing gates.
    # Without it the whole review would vanish from the checks, and a check that does not report is
    # the failure mode this file exists to prevent.
    needs: [docs, commits, pr-body]
    if: ${{ always() }}
    uses: ./.github/workflows/docs-review.yml
    with:
      publish: true
      l1-results: >-
        {"docs-lint": "${{ needs.docs.result }}",
         "commit-lint": "${{ needs.commits.result }}",
         "pr-body-check": "${{ needs.pr-body.result }}"}
      # THIS REPOSITORY'S OWN RULES, alongside the organisation's — the same seam every other
      # repository gets, finally used by the repository that built it. The shared routine judges
      # prose and pull request bodies; nothing judged the Python that decides required checks, the
      # YAML that decides what runs, or the routine file every reviewer reads at `main`.
      repo-routine: repo-review-rules.md
      # The checks this repository already runs, handed to the reviewer as output rather than left
      # as a job result it cannot see. CI runs them because the runner's harness denies Bash.
      # `;` and not `&&`: a check that exits non-zero has something to say, and `&&` would stop the
      # list at the first one that did.
      #
      # THE FIRST COMMAND IS AN INSTALL, and it installs what the JOBS install rather than what the
      # scripts turn out to need. It is here and not in the routine because the routine cannot know
      # a repository's dependencies, and it is the jobs' list because "what is already on the
      # runner" is not a thing this file can see: `pyyaml` happens to be there today, `referencing`
      # is not, and the difference is invisible until a suite fails. Without it `publish_verdict_suite.py`
      # failed 57 of its 129 cases on `ModuleNotFoundError: No module named 'referencing'` and the
      # reviewer was handed that as the state of this repository's own gate — while the CI job two
      # blocks down ran the identical command green, because it installs first. Two places running
      # one command in two environments, and nothing compared them until a review did
      # (exeris-systems/.github#62, the first pull request the routine has actually read since
      # `repo-checks` was wired: #59, #60 and #61 all changed the entry workflow and were never
      # reviewed at all). `repo_checks_env_check.py` compares them now.
      #
      # EVERY CHECK. A reviewer reads `repo-checks.out` as the state of this repository, so a gate
      # missing from this list is a gate it cannot see: its result never reaches the verdict, and a
      # rule it enforces can break without anything saying so.
      repo-checks: >-
        pip install --quiet pyyaml jsonschema referencing;
        python3 scripts/publish_verdict_suite.py --root .;
        python3 scripts/entry_workflow_suite.py;
        python3 scripts/gate_vocabulary_check.py --root .;
        python3 scripts/principal_check.py --root .;
        python3 scripts/repo_checks_env_check.py --root .;
        python3 scripts/repo_checks_env_check_suite.py;
        python3 scripts/label_map_check.py;
        python3 scripts/caller_permissions_check.py
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      exeris_bot_app_id: ${{ secrets.EXERIS_BOT_APP_ID }}
      exeris_bot_private_key: ${{ secrets.EXERIS_BOT_PRIVATE_KEY }}
  docs:
    uses: ./.github/workflows/docs-lint.yml
    with:
      mode: strict
      section-check: true
  commits:
    uses: ./.github/workflows/commit-lint.yml
  pr-body:
    uses: ./.github/workflows/pr-body-check.yml
  # caller-example/*.yml is the file every repository copies. When it grants less than one of the
  # workflows it calls declares, GitHub does not run that job with less — it rejects the whole file
  # as invalid, in the adopting repository, on the first push, with no logs. That happened to
  # exeris-kernel; this makes the next one fail here instead, where it is cheap.
  caller-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      - run: pip install --quiet pyyaml
      - run: python scripts/caller_permissions_check.py
  # Two assertions about the verdict contract this repository now owns. They are here rather than
  # in docs-lint.yml because each compares two files that exist only here: no other repository has
  # this composed schema, this label map, or a reason to care which ref this one vendored.
  #
  # `caller_bundle_check.py` is the third and does not run here. It asks whether a CALLER's pin is
  # MAJOR-compatible with the base a verdict is validated against, and a caller's manifest is in a
  # caller's checkout. Handed this repository's own, it compares the pin with itself and answers
  # yes for a reason no arrangement of the two files could change; the question it was standing in
  # for — that the pin is coherent with the tree beside it — is `bundle_pin_check.py`'s, and that
  # one runs. The script stays: the publish step checks a caller's repository out, and that is
  # where it gets a caller.
  #
  # One job, and each step runs whatever the one before it did: two worklists behind the first red
  # one is the failure docs-lint.yml's step comments describe, and it is no cheaper here.
  verdict-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      - run: pip install --quiet pyyaml
      - name: The vendored bundle is the one docs-lint fetches
        run: python scripts/bundle_pin_check.py
      - name: The label map names only tags and labels that exist
        if: ${{ !cancelled() }}
        run: python scripts/label_map_check.py
      # The publish step of ADR-087 §B.5-B.10 decides whether a pull request in any repository may
      # merge, and nothing in this repository's CI can run it end to end: it needs a model, a token
      # and a pull request in a caller. What it can run is every rule the step applies, which is
      # where the rules live — `publish_verdict.py` plans and never writes, so the plan is checkable
      # with no network. Each red path §B.8 names has a case, and each case was confirmed to fail
      # when the rule it covers is removed from the planner.
      - name: The publish step's rules, one case per red path
        if: ${{ !cancelled() }}
        run: |
          pip install --quiet jsonschema referencing
          python scripts/publish_verdict_suite.py --root .
      # The mapping between GitHub's gate vocabulary and the verdict's. They are two files apart
      # and neither knows the other changed; the tell is a refused verdict, which reads as the
      # runner emitting nonsense rather than as this repository drifting from its own schema.
      - name: The gate results speak the verdict's vocabulary
        if: ${{ !cancelled() }}
        run: python scripts/gate_vocabulary_check.py --root .
      # The half the suite above cannot reach: it drives the planner with `--workflow-touching`
      # already computed, so the shell that computes it was cited as covered and was not. A wrong
      # `true` there is a fail-open — it is what lets `l2-human-reviewed` green a check with no
      # review behind it.
      - name: The entry-workflow question, one case per way of getting it wrong
        if: ${{ !cancelled() }}
        run: python scripts/entry_workflow_suite.py
      # Two labels carry authority no routine may grant itself: one starts a review, the other
      # tells the required check a person made it. Both are ordinary labels, and the rules deciding
      # who may apply them live in workflow expressions no suite can execute. This reads the
      # expressions that SHIP and fails when one is edited back to a form that trusts the caller.
      - name: The doors that ask for a person ask GitHub what applied the label
        if: ${{ !cancelled() }}
        run: |
          pip install --quiet pyyaml
          python scripts/principal_check.py --root .
      # The same command in two places is two places until something says so. `repo-checks` hands
      # the reviewer this repository's own gates; the jobs above run several of the same scripts.
      # When they disagree about what is installed, the reviewer reads a failure that CI does not
      # have — and reads it as the repository's state.
      - name: The reviewer's checks run in the environment the jobs test them in
        if: ${{ !cancelled() }}
        run: |
          pip install --quiet pyyaml
          python scripts/repo_checks_env_check.py --root .
      # The checker above decides whether the reviewer is handed a broken environment, and it was
      # written twice before anything exercised it: first it compared package names while the
      # interpreter differed, then the interpreter rule shipped with no case. A checker with no
      # cases is the thing it checks for.
      - name: The environment comparison, one case per way of getting it wrong
        if: ${{ !cancelled() }}
        run: python scripts/repo_checks_env_check_suite.py
