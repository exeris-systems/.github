# Reusable: release of an Exeris capability (`eu.exeris.caps:exeris-caps-*`) — build, sign, gate, upload.
#
# A capability needs two things the library repositories do not: a TWO-PASS build (the annotation
# processor writes the capability metadata that `exeris:generate` reads only during compile, so a
# seed pass with codegen skipped comes first) and a check that the committed generated tree is what
# that build produces. Everything else — tag shape, version agreement, readiness gate, Central
# bundle layout, provenance — is the release path of the SDK, the kernel and the tooling.
#
# THREE JOBS, AND THE SPLIT IS THE SECURITY MODEL
#
#   build    No secret, read-only token. Always runs. Builds with `-P release`, signs with a key
#            generated in the job, runs every gate, uploads what it built as a run artifact. A dry
#            run is this job and nothing else.
#   publish  The only job that holds secrets. Runs only when `upload` is true AND `target` is not
#            `none`. Rebuilds from the same commit, signs with the real key, uploads.
#   attest   Provenance for what `publish` uploaded. Holds `id-token: write` and runs no project code.
#
# WHAT A DRY RUN CAN NEVER DO. It holds no secret: the `secrets:` below are read by `publish` alone.
# It cannot upload: nothing in `build` talks to Central or GitHub Packages, and its token is
# `contents: read`. It cannot attest: attestations are written to the repository and to a public
# transparency log that has no delete, and only `attest` may write them. It signs with a throwaway
# key that exists for the length of the job, so the path through the signing plugin is exercised
# and the signatures it produces mean nothing outside the run.
#
# WHERE THE SECRETS ARE
#
#   GPG_PRIVATE_KEY          the "Import the signing key" step, which runs `gpg` and nothing else.
#   GPG_PASSPHRASE           the deploy step only.
#   CENTRAL_TOKEN_USERNAME   the deploy step only, and only for `target: central`.
#   CENTRAL_TOKEN_PASSWORD   the deploy step only, and only for `target: central`.
#   GITHUB_TOKEN (packages)  the deploy step only, and only for `target: github-packages`.
#
# STEPS OF `publish`, IN ORDER, AND WHAT EACH CAN REACH
#
#   1  fetch and fingerprint the gate   no key, no secret; before any project code
#      scripts
#   2  check the secrets exist          booleans only; no secret value in the environment
#   3  JDK, version edit, seed pass,    the repository's build logic, no key and no secret
#      effective-POM guard
#   4  write the Maven settings         a file of `${env.*}` placeholders; no secret value
#   5  import the signing key           PRIVATE KEY IMPORTABLE from here: runs `gpg` and nothing else
#   6  build, sign and upload           PRIVATE KEY, PASSPHRASE and the upload credential; the only
#                                       step that runs the project's POM with a secret
#   7  remove the signing key           `if: always()`. Stops the agent, deletes the private keyring
#                                       and leaves a keyring holding the PUBLIC key alone
#   8  drift check, readiness gate,     no private key and no secret in the runner: the gate
#      run artifact                     verifies signatures with the public key only
#
# The private key is therefore importable in steps 5 and 6 and in no other step. The passphrase and
# the upload credentials are in step 6 alone. `publish` runs NO tests: step 6 passes `-DskipTests`
# and the seed pass only compiles. It relies on `build`, which runs the tests on the same commit
# before `publish` can start (`needs: build`), and which a failing test stops. Nothing in `publish`
# re-checks that the tests passed; the dependency does.
#
# `build` runs no step that holds a secret at all: its key is generated in the job.
#
# WHAT CANNOT BE AVOIDED. `deploy` is the project's own POM: Maven loads every plugin, extension and
# annotation processor the effective build names — the repository's POM, its parents, the codegen
# plugin and the processor, and whatever those resolve — into one JVM with the step's environment
# and with the imported key in the runner's keyring. Any of them can read the passphrase, the
# Central token or the GitHub token, and use the key. The signing step cannot be moved out of that
# JVM: the signature is made by the plugin during the build, which is also what puts the signed
# files into the bundle. Signing outside Maven would not change that
# for the token, because `central-publishing-maven-plugin` is what uploads. What bounds it: the
# secrets live in `publish` alone; `publish` restores no build cache, so nothing a pull request
# could have written is on its classpath; the Central deployment is created with `autoPublish`
# false in the POM, so a person still presses Publish and an unpublished deployment can be dropped;
# the GitHub token is repository-scoped and expires with the job. The release POM is therefore code
# that runs with the secrets and has to be reviewed as such.
#
# THE GATE SCRIPTS. What is signed and uploaded is decided by code in this repository, not by
# inline shell: `scripts/caps_release/` holds one script per decision (the version and the ref, the
# release profile and single-module check, the version of a tagged POM, the SNAPSHOT scan, the
# self-publishing POM guard, the dry-run upload guard, the drift check, the readiness gate, the
# secrets check, the key removal), each taking its inputs as arguments or named environment
# variables and reporting through its exit status, so `tests/caps_release/` runs them on plain
# files. A `run:` block calls them and decides nothing.
#
#   Which commit. Each job checks this repository out at `github.job_workflow_sha`, the commit the
#   running workflow file came from, so a caller that pins this workflow by commit runs the scripts
#   of that commit and a caller on `@main` runs the scripts of `main` as it stood when the run
#   started. Neither can get the workflow of one commit and the scripts of another.
#
#   Where they run from. The checkout lands in the workspace, which is where the project's build
#   has write access, so the first thing done with it is to copy the scripts to
#   `$RUNNER_TEMP/caps-release-scripts`, delete the checkout, make them read-only and compute a
#   digest over their names, modes and contents. The digest is a step OUTPUT: the runner keeps
#   it and substitutes it into a later step's own `env:` when that step starts, so it is not read
#   from a file in the workspace or in the temp directory, where the build could have rewritten it
#   beside the scripts. Every step that runs a script after project code has run
#   recomputes the digest, with `PATH=/usr/bin:/bin`, and refuses on a difference. The scripts
#   run as `/usr/bin/python3 -I -B`: isolated mode ignores `PYTHON*` variables and the working
#   directory, and no bytecode is written into the verified directory.
#
#   What remains possible. Code that runs as the runner user on the runner can change anything the
#   runner user can: it can `sudo`, replace `/usr/bin/python3` or `sha256sum`, edit `target/`, or
#   rewrite a later step's behaviour through `$GITHUB_PATH`. The digest closes the narrow, likely
#   case, a build that overwrites a gate script before the gates run, and makes any change to the
#   scripts a failure instead of a silent pass. It is not a defence against a hostile build, which
#   already holds the key during the deploy; what bounds that is the list above.
#
# PRECONDITIONS THE WORKFLOW CHECKS. A capability is a single-module project: a POM that declares
# `<modules>` is refused, because the readiness gate, the run artifact and the attestation all read
# the root `target/` and would otherwise disagree about what was released. The version a dry run is
# given is one MAJOR.MINOR.PATCH line, matched as a whole string. A snapshot project version (Maven's
# own definition: a `SNAPSHOT` suffix in any case, or the timestamped form) is an error on every run.
# A snapshot among the DEPENDENCIES, or a floating version (a range, `LATEST`, `RELEASE`) anywhere,
# refuses any run with `upload: true`; on a dry run (`upload: false`) it is a warning listed in the
# step summary, because a capability that depends on another capability's snapshot could not
# otherwise rehearse.
#
# WHAT IS UPLOADED AND ATTESTED IS WHAT WAS GATED. The readiness gate closes the set of releasable
# files (a main jar, its `-sources` and `-javadoc` jars, the pom, their `.asc` signatures, and the
# Central bundle) and refuses everything else that `target/` holds under those extensions: a `-tests`
# jar, any other classifier, a symbolic link. It binds the Central bundle to the files that were
# built (the bundle holds exactly the eight gated files and all four checksum files, `.md5`, `.sha1`,
# `.sha256` and `.sha512`, of each of them, as the Central publishing plugin writes it; its ZIP layout,
# extra fields and payloads are checked entry by entry), and copies exactly the files it gated into `$RUNNER_TEMP/gated-files` (`--stage`). The run
# artifact is that directory and nothing else, and the attestation covers the run artifact, so the
# three cannot disagree about what was released.
#
# Each gated file is read once, into a private directory of the gate, and every check (signature,
# POM, javadoc, bundle) is made on that read; staging re-hashes the live file, refuses on a
# difference, and copies from the private read. What is staged is byte-identical to what was
# verified, and a file swapped in afterwards is a refusal, not a different release.
#
# A refused run stages NOTHING: the gate creates `gated-files` only when every check passed, and
# removes it if staging itself fails. The artifact steps therefore run on success only, so a failed
# gate leaves no artifact that could be mistaken for a release, and `attest` and any later reader
# only ever see a directory a passing gate wrote. A passing gate has staged files, so both artifact
# steps fail on an empty path (`if-no-files-found: error`). Diagnosis of a refusal is the gate's log, whose
# `::error::` lines name every finding.
#
# Actions are pinned by commit, the way the release workflows of the SDK, the kernel and the
# tooling are, because this workflow handles signing keys; the gates in this directory pin by tag.
# A caller names this workflow `@main` like the gates, or by commit.
name: caps-release
on:
  workflow_call:
    inputs:
      version:        { type: string,  default: "",          description: "Release version for a dry run by dispatch, MAJOR.MINOR.PATCH. Ignored on a tag, where the version is the tag and a differing value is refused" }
      upload:         { type: boolean, default: false,       description: "Upload what was built. Takes effect only with a target other than 'none'" }
      target:         { type: string,  default: "none",      description: "Where an upload goes: 'none' (nothing is uploaded), 'central' (Maven Central, a deployment a person still publishes) or 'github-packages'" }
      java-version:   { type: string,  default: "25" }
      java-distribution: { type: string, default: "temurin" }
      generated-path: { type: string,  default: "src/main/generated/", description: "The committed generated tree the build must reproduce" }
    secrets:
      GPG_PRIVATE_KEY:        { required: false, description: "Armored private signing key. Read by `publish`, for any target" }
      GPG_PASSPHRASE:         { required: false, description: "Passphrase of that key. Read by `publish`" }
      CENTRAL_TOKEN_USERNAME: { required: false, description: "Central Portal user token, name part. Read by `publish` for target 'central'" }
      CENTRAL_TOKEN_PASSWORD: { required: false, description: "Central Portal user token, password part. Read by `publish` for target 'central'" }
permissions:
  contents: read
jobs:
  build:
    name: build, sign with a throwaway key, gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.rel.outputs.version }}
      publish: ${{ steps.rel.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The gate scripts come from the commit this workflow file came from (see the header), are
      # copied OUT of the workspace, and are fingerprinted before any project code has run.
      - name: Fetch the gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: exeris-systems/.github
          ref: ${{ github.job_workflow_sha }}
          path: .caps-release-src
          persist-credentials: false
      - name: Install the gate scripts outside the workspace
        id: scripts
        env:
          SCRIPTS_COMMIT: ${{ github.job_workflow_sha }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/caps-release-scripts"
          mkdir -m 700 "$dest"
          cp .caps-release-src/scripts/caps_release/*.py "$dest/"
          rm -rf .caps-release-src
          chmod 500 "$dest"/*.py
          chmod 500 "$dest"
          digest="$(cd "$dest" && export PATH=/usr/bin:/bin &&
            { find . -mindepth 1 -printf '%y %m %p\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "gate scripts: commit $SCRIPTS_COMMIT, digest $digest" | tee -a "$GITHUB_STEP_SUMMARY"

      # Ordered by cost. Everything up to the JDK needs no download, so a ref that cannot release
      # fails in seconds and says why. Every `${{ }}` is bound to a variable and read as one:
      # `inputs.version` is text a dispatcher types, and textual substitution would put it inside
      # the script instead of handing it to the script.
      - name: Resolve the version and refuse an unreleasable ref
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IN_VERSION: ${{ inputs.version }}
          IN_UPLOAD: ${{ inputs.upload }}
          IN_TARGET: ${{ inputs.target }}
          GENERATED: ${{ inputs.generated-path }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B "$RUNNER_TEMP/caps-release-scripts/resolve_release.py" \
            --target "$IN_TARGET" --upload "$IN_UPLOAD" --version "$IN_VERSION" --generated-path "$GENERATED" \
            --ref-type "$GITHUB_REF_TYPE" --ref-name "$GITHUB_REF_NAME" --ref "$GITHUB_REF" \
            --default-branch "$DEFAULT_BRANCH" --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --output "$GITHUB_OUTPUT"

      # Maven treats `-P release` for a profile that does not exist as a warning and builds on,
      # which produces unsigned artifacts that fail much later with a message naming neither the
      # profile nor the cause. This refuses it up front, and decides whether a Central bundle is
      # built and gated.
      - name: Refuse a ref without the release profile
        id: profile
        env:
          IN_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B "$RUNNER_TEMP/caps-release-scripts/check_release_profile.py" \
            --pom pom.xml --target "$IN_TARGET" --output "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven

      # On a tag the release ritual has already put the version in the POM, and a tag whose version
      # disagrees with the POM it points at is a tag on the wrong commit; `versions:set` would
      # overwrite the evidence. On a dry run the tree is a development line and setting the version
      # is the point; nothing is committed.
      - name: Set the release version — or, on a tag, check it
        env:
          WANT: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            /usr/bin/python3 -I -B "$RUNNER_TEMP/caps-release-scripts/check_pom_version.py" --pom pom.xml --want "$WANT"
          else
            mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="$WANT" -DgenerateBackupPoms=false
          fi

      # After the version is final, so a -SNAPSHOT left is a pin on something not released: in the
      # effective POM (a property, a plugin, a processor path) or in the resolved dependency tree.
      # The same effective POM is what the Central plugin's configuration is read from: a POM that
      # sets `autoPublish` or `waitUntil` to a contrary value is refused, because a command-line
      # property does not override an explicit POM value.
      #
      # The scripts run after Maven has run the project's plugins, so they are verified against the
      # digest taken before any project code ran.
      - name: Refuse a SNAPSHOT or a self-publishing POM in the release build
        env:
          IN_UPLOAD: ${{ inputs.upload }}
          SCRIPTS_DIGEST: ${{ steps.scripts.outputs.digest }}
        run: |
          set -euo pipefail
          mvn -B -ntp -q -P release org.apache.maven.plugins:maven-help-plugin:3.5.1:effective-pom -Doutput="$RUNNER_TEMP/effective-pom.xml"
          mvn -B -ntp -q -P release org.apache.maven.plugins:maven-dependency-plugin:3.8.1:list -DoutputFile="$RUNNER_TEMP/dependencies.txt"
          S="$RUNNER_TEMP/caps-release-scripts"
          [ "$(cd "$S" && export PATH=/usr/bin:/bin &&
            { find . -mindepth 1 -printf '%y %m %p\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)" = "$SCRIPTS_DIGEST" ] \
            || { echo "::error::the gate scripts changed after they were installed." >&2; exit 1; }
          /usr/bin/python3 -I -B "$S/scan_snapshots.py" --effective-pom "$RUNNER_TEMP/effective-pom.xml" \
            --dependencies "$RUNNER_TEMP/dependencies.txt" --upload "$IN_UPLOAD" --summary "$GITHUB_STEP_SUMMARY"
          /usr/bin/python3 -I -B "$S/check_auto_publish.py" --effective-pom "$RUNNER_TEMP/effective-pom.xml"

      # The signing plugin is exercised on every run, and no secret is needed to do it: a key made
      # here, with a random passphrase, kept in a private keyring that dies with the runner. The
      # alternative, skipping the plugin, would leave the signature half of the readiness gate
      # untested until a real release. The signatures this run produces verify against nothing a
      # consumer holds; the run artifact is named for what it is.
      - name: Generate a throwaway signing key
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/dry-run-gnupg"
          mkdir -m 700 "$home"
          pass="$(openssl rand -hex 24)"
          echo "::add-mask::$pass"
          GNUPGHOME="$home" gpg --batch --pinentry-mode loopback --passphrase "$pass" \
            --quick-generate-key "Exeris caps release gate (throwaway) <gate@invalid>" ed25519 sign 1d
          { echo "GNUPGHOME=$home"; echo "MAVEN_GPG_PASSPHRASE=$pass"; } >> "$GITHUB_ENV"
          echo "signing: a throwaway key generated in this job; nothing it signs is publishable" >> "$GITHUB_STEP_SUMMARY"

      - name: Seed capability metadata (first pass, codegen skipped)
        run: mvn -B -ntp compile -Dexeris.codegen.skip=true

      # With the Central plugin in the POM the build runs `deploy` with the upload skipped, which
      # writes the bundle a release would upload; without it, `verify`. Either way the gate below
      # inspects what a release would send.
      #
      # `skipUpload` is the plugin's own parameter (property `skipUpload`, default false): the
      # bundle is built and nothing is sent. This job holds no credential for the plugin's server
      # id and is given an empty settings file, so an upload attempted despite the property would
      # fail on the missing credential rather than succeed quietly. The log is kept for the guard
      # in the gate step, which needs the plugin's own statement that it skipped the upload.
      - name: Build with the release profile (second pass)
        env:
          HAS_CENTRAL: ${{ steps.profile.outputs.has_central_plugin }}
        run: |
          set -euo pipefail
          if [ "$HAS_CENTRAL" = "true" ]; then
            printf '%s\n' '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"/>' > "$RUNNER_TEMP/empty-settings.xml"
            mvn -B -ntp -P release deploy -DskipUpload=true -DautoPublish=false -DwaitUntil=validated \
              --settings "$RUNNER_TEMP/empty-settings.xml" 2>&1 | tee "$RUNNER_TEMP/dry-run-deploy.log"
          else
            mvn -B -ntp -P release verify
          fi

      # Every gate on what the build produced, in one step so that the scripts are verified once,
      # after the last project code has run and before the first gate reads anything.
      #
      # The generated tree: `exeris:generate` writes into the source tree, and that tree is
      # committed. A build whose output differs from the committed copy means the declaration and
      # the manifest a SKU consumes disagree.
      - name: Gate what was built
        env:
          HAS_CENTRAL: ${{ steps.profile.outputs.has_central_plugin }}
          GENERATED: ${{ inputs.generated-path }}
          SCRIPTS_DIGEST: ${{ steps.scripts.outputs.digest }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/caps-release-scripts"
          [ "$(cd "$S" && export PATH=/usr/bin:/bin &&
            { find . -mindepth 1 -printf '%y %m %p\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)" = "$SCRIPTS_DIGEST" ] \
            || { echo "::error::the gate scripts changed after they were installed." >&2; exit 1; }
          if [ "$HAS_CENTRAL" = "true" ]; then
            /usr/bin/python3 -I -B "$S/check_dry_run_log.py" --log "$RUNNER_TEMP/dry-run-deploy.log"
          fi
          /usr/bin/python3 -I -B "$S/check_drift.py" --repo . --generated "$GENERATED"
          /usr/bin/python3 -I -B "$S/check_release_readiness.py" --target-dir target \
            --expect-bundle "$HAS_CENTRAL" --gpg /usr/bin/gpg --stage "$RUNNER_TEMP/gated-files"

      - name: Keep what was built as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-gate-${{ steps.rel.outputs.version }}
          path: ${{ runner.temp }}/gated-files
          if-no-files-found: error
          retention-days: 90

  publish:
    name: sign and upload
    needs: build
    if: ${{ needs.build.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    # `packages: write` is the GitHub Packages target. The token is not put in the environment of
    # any step unless that target is chosen. It is declared for the job and not narrowed per
    # target: a job's permissions take no expression, so narrowing would be a second copy of this
    # job, and a caller must grant the union of what the workflow's jobs declare in any case.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before the key exists and before any project code: see the header for why the scripts live
      # outside the workspace and what their digest guards.
      - name: Fetch the gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: exeris-systems/.github
          ref: ${{ github.job_workflow_sha }}
          path: .caps-release-src
          persist-credentials: false
      - name: Install the gate scripts outside the workspace
        id: scripts
        env:
          SCRIPTS_COMMIT: ${{ github.job_workflow_sha }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/caps-release-scripts"
          mkdir -m 700 "$dest"
          cp .caps-release-src/scripts/caps_release/*.py "$dest/"
          rm -rf .caps-release-src
          chmod 500 "$dest"/*.py
          chmod 500 "$dest"
          digest="$(cd "$dest" && export PATH=/usr/bin:/bin &&
            { find . -mindepth 1 -printf '%y %m %p\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "gate scripts: commit $SCRIPTS_COMMIT, digest $digest" | tee -a "$GITHUB_STEP_SUMMARY"

      # Booleans only: the expressions below are evaluated here and no secret value reaches the
      # step's environment.
      - name: Refuse an upload that lacks what its target needs
        env:
          IN_TARGET: ${{ inputs.target }}
          HAVE_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
          HAVE_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE != '' }}
          HAVE_CENTRAL_USER: ${{ secrets.CENTRAL_TOKEN_USERNAME != '' }}
          HAVE_CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD != '' }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B "$RUNNER_TEMP/caps-release-scripts/check_secrets.py" --target "$IN_TARGET"

      # No build cache here: whatever a pull request could have written to it would otherwise be on
      # the classpath of a step that holds the signing key.
      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Set the release version — or, on a tag, check it
        env:
          WANT: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            /usr/bin/python3 -I -B "$RUNNER_TEMP/caps-release-scripts/check_pom_version.py" --pom pom.xml --want "$WANT"
          else
            mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="$WANT" -DgenerateBackupPoms=false
          fi

      # Before the key exists: the repository's build logic runs here with no secret in reach.
      - name: Seed capability metadata (first pass, codegen skipped)
        run: mvn -B -ntp compile -Dexeris.codegen.skip=true

      # The effective POM of the commit about to be uploaded, read before the key is imported: the
      # Central plugin must not be configured to publish on its own or to skip validation.
      - name: Refuse a self-publishing POM
        env:
          SCRIPTS_DIGEST: ${{ steps.scripts.outputs.digest }}
        run: |
          set -euo pipefail
          mvn -B -ntp -q -P release org.apache.maven.plugins:maven-help-plugin:3.5.1:effective-pom -Doutput="$RUNNER_TEMP/effective-pom.xml"
          S="$RUNNER_TEMP/caps-release-scripts"
          [ "$(cd "$S" && export PATH=/usr/bin:/bin &&
            { find . -mindepth 1 -printf '%y %m %p\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)" = "$SCRIPTS_DIGEST" ] \
            || { echo "::error::the gate scripts changed after they were installed." >&2; exit 1; }
          /usr/bin/python3 -I -B "$S/check_auto_publish.py" --effective-pom "$RUNNER_TEMP/effective-pom.xml"

      # Written by the workflow, not read from the repository: a settings file the repository
      # controls could name a mirror, and the credentials are then sent wherever it says. The ids
      # are the ones the release profile and the deploy step name. Values are resolved by Maven
      # from the environment of the deploy step alone.
      - name: Write the Maven settings
        run: |
          cat > "$RUNNER_TEMP/release-settings.xml" <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_TOKEN_USERNAME}</username>
                <password>${env.CENTRAL_TOKEN_PASSWORD}</password>
              </server>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML

      # The step that runs `gpg` and nothing else. After it the private key is in a keyring of its
      # own until "Remove the signing key" deletes that keyring, directly after the deploy; the
      # passphrase is never in it and reaches the deploy step alone. The public half is exported to
      # a file so that the later checks can verify signatures without the private key.
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/publish-gnupg"
          mkdir -m 700 "$home"
          echo "GNUPGHOME=$home" >> "$GITHUB_ENV"
          printf '%s' "$GPG_PRIVATE_KEY" | GNUPGHOME="$home" gpg --batch --import
          GNUPGHOME="$home" gpg --list-secret-keys --keyid-format long
          GNUPGHOME="$home" gpg --batch --armor --export > "$RUNNER_TEMP/signing-public.asc"

      # The deploy runs the project's POM with the secrets in its environment; see the header for
      # what that exposes. It skips the tests: `build` ran them on this commit.
      #
      # Central: the command line passes `-DautoPublish=false -DwaitUntil=validated`. Maven applies
      # a user property only to a parameter the POM leaves unset, so these decide the case where the
      # POM is silent, and "Refuse a self-publishing POM" above refuses the case where the POM
      # states a contrary value. Either way a deployment is created and stops, the step blocks
      # until Central has validated it, and a person presses Publish in the portal; until then it
      # can be dropped, afterwards nothing about it can ever be changed.
      #
      # GitHub Packages: `central-publishing-maven-plugin` owns the `deploy` phase and sets
      # `maven.deploy.skip`, so the deploy goal is invoked by name with the skip lifted.
      - name: Build, sign and upload
        env:
          IN_TARGET: ${{ inputs.target }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ inputs.target == 'central' && secrets.CENTRAL_TOKEN_USERNAME || '' }}
          CENTRAL_TOKEN_PASSWORD: ${{ inputs.target == 'central' && secrets.CENTRAL_TOKEN_PASSWORD || '' }}
          GITHUB_TOKEN: ${{ inputs.target == 'github-packages' && github.token || '' }}
        run: |
          set -euo pipefail
          settings="$RUNNER_TEMP/release-settings.xml"
          if [ "$IN_TARGET" = "central" ]; then
            mvn -B -ntp -P release deploy -DskipTests -DautoPublish=false -DwaitUntil=validated --settings "$settings"
          else
            mvn -B -ntp -P release verify org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy \
              -DskipTests -Dmaven.deploy.skip=false \
              -DaltDeploymentRepository="github::https://maven.pkg.github.com/${GITHUB_REPOSITORY}" \
              --settings "$settings"
          fi

      # Directly after the deploy, whether it passed or not, and before any later step: stops the
      # agent that may have cached the passphrase, deletes the keyring that held the private key
      # and leaves a keyring with the public key alone. The checks below read nothing else, and
      # `gpg --verify` needs no private key. The script fails if a secret key is still listed.
      #
      # The project's POM has just run, so the script is verified first. If it was changed, the
      # keyring is still deleted here, by the step itself, and the step fails.
      - name: Remove the signing key
        if: ${{ always() }}
        env:
          SCRIPTS_DIGEST: ${{ steps.scripts.outputs.digest }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/caps-release-scripts"
          if [ "$(cd "$S" && export PATH=/usr/bin:/bin &&
            { find . -mindepth 1 -printf '%y %m %p\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)" != "$SCRIPTS_DIGEST" ]; then
            rm -rf "$RUNNER_TEMP/publish-gnupg" "$RUNNER_TEMP/signing-public.asc"
            echo "::error::the gate scripts changed after they were installed; the private key was deleted without them." >&2
            exit 1
          fi
          /usr/bin/python3 -I -B "$S/remove_signing_key.py" --secret-home "$RUNNER_TEMP/publish-gnupg" \
            --verify-home "$RUNNER_TEMP/verify-gnupg" --public-key "$RUNNER_TEMP/signing-public.asc" \
            --env-file "$GITHUB_ENV" --gpg /usr/bin/gpg --gpgconf /usr/bin/gpgconf

      # The same gates as in `build`, against the real signatures and the bundle that was sent.
      - name: Gate what was uploaded
        env:
          EXPECT_BUNDLE: ${{ inputs.target == 'central' && 'true' || 'false' }}
          GENERATED: ${{ inputs.generated-path }}
          SCRIPTS_DIGEST: ${{ steps.scripts.outputs.digest }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/caps-release-scripts"
          [ "$(cd "$S" && export PATH=/usr/bin:/bin &&
            { find . -mindepth 1 -printf '%y %m %p\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)" = "$SCRIPTS_DIGEST" ] \
            || { echo "::error::the gate scripts changed after they were installed. If a deployment was uploaded, DROP it." >&2; exit 1; }
          /usr/bin/python3 -I -B "$S/check_drift.py" --repo . --generated "$GENERATED" --uploaded
          /usr/bin/python3 -I -B "$S/check_release_readiness.py" --target-dir target \
            --expect-bundle "$EXPECT_BUNDLE" --uploaded --gpg /usr/bin/gpg --stage "$RUNNER_TEMP/gated-files"

      - name: Keep what was uploaded as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/gated-files
          if-no-files-found: error
          retention-days: 90

  # Provenance says which workflow, at which commit, on which runner produced a file; a signature
  # says only who held the key. It is written to the repository and, through `id-token`, to a public
  # transparency log with no delete path, so it exists only for what was uploaded. Its own job, and
  # no project code runs in it: `id-token: write` puts the means to mint an OIDC token in the
  # environment of every step of the job that has it, and a step that runs the repository's POM
  # could use them to attest anything. It attests the files `publish` kept, which are the files it
  # uploaded.
  attest:
    name: attest build provenance
    needs: [build, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # SLSA provenance signing (Sigstore, keyless)
      attestations: write   # writing the attestation back to the repository
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.version }}
          path: uploaded
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            uploaded/**/*.jar
            uploaded/**/*.pom
            uploaded/**/*.zip
