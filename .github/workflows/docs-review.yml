# Reusable, and a wrapper: the L2 review under its old entry point. The review itself is
# `review.yml`; this file exists so that a repository whose `guardrails.yml` still calls
# `docs-review.yml` keeps reporting the required check it was configured with, byte for byte:
#
#     docs-review / publish / verdict
#
# A check is named `<caller job> / <job> / <nested job>`, one segment for each workflow the run
# passes through. The caller's job is `docs-review`, this file's one job is `publish`, and `verdict`
# is a job of `review.yml` with steps of its own. Rename `publish` and every repository that has not
# moved is left waiting on a check that no longer reports, and a pull request waiting on a required
# check that never reports cannot merge.
#
# The inputs and secrets below are `review.yml`'s, with the same names, types and defaults, and are
# handed over unchanged. `scripts/review_wrapper_check.py` fails when the two lists part.
#
# A caller moves to `review.yml` by renaming its job to `review` and its `uses:` to `review.yml`
# (the per-caller change is in the README). This file is removed when the last caller has moved.
name: docs-review
on:
  workflow_call:
    inputs:
      extra-paths:
        type: string
        default: ""
        description: "Additional path globs that should trigger the docs review, one per line"
      runner:
        type: string
        default: "claude-code-action"
        description: "Which runner produces the verdict (see review.yml)"
      publish:
        type: boolean
        default: false
        description: "Whether the verdict is published and gated (see review.yml)"
      l1-results:
        type: string
        default: ""
        description: "What the caller's L1 gates concluded, as JSON (see review.yml)"
      review-label:
        type: string
        default: "needs-review"
        description: "The label a human applies to ask for a review"
      repo-routine:
        type: string
        default: ""
        description: "A file in the calling repository holding that repository's own review rules"
      repo-checks:
        type: string
        default: ""
        description: "A shell command run in the checked-out repository before the model"
      review-in-parts:
        type: boolean
        default: false
        description: "Whether the routine runs as its parts, composed into one verdict"
      mandatory-gates:
        type: string
        default: ""
        description: "Comma-separated L1 gates whose `not-run` makes the required check red"
      capture:
        type: boolean
        default: false
        description: "Whether this run becomes a row in the execution dataset (needs publish: true)"
    secrets:
      claude_code_oauth_token: { required: true }
      exeris_bot_app_id: { required: false }
      exeris_bot_private_key: { required: false }
      exeris_inbox_app_id: { required: false }
      exeris_inbox_private_key: { required: false }
# The union `review.yml` declares. A called workflow can only narrow its caller's permissions, and
# this file's job passes the caller's block through, so the block is the one the callers already
# grant.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  # The job id is the middle segment of the required check's name. Do not rename it.
  #
  # `review.yml` is reached at `@main` because a reusable workflow cannot refer to another by a
  # relative path: a caller that pins THIS file by commit pins the wrapper and receives the review
  # from `main`.
  publish:
    uses: exeris-systems/.github/.github/workflows/review.yml@main
    with:
      extra-paths: ${{ inputs.extra-paths }}
      runner: ${{ inputs.runner }}
      publish: ${{ inputs.publish }}
      l1-results: ${{ inputs.l1-results }}
      review-label: ${{ inputs.review-label }}
      repo-routine: ${{ inputs.repo-routine }}
      repo-checks: ${{ inputs.repo-checks }}
      review-in-parts: ${{ inputs.review-in-parts }}
      mandatory-gates: ${{ inputs.mandatory-gates }}
      capture: ${{ inputs.capture }}
    # Named rather than inherited: the repositories that call this file refuse `secrets: inherit`
    # (SonarCloud S7631), and an absent secret arrives as an empty string.
    secrets:
      claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
      exeris_bot_app_id: ${{ secrets.exeris_bot_app_id }}
      exeris_bot_private_key: ${{ secrets.exeris_bot_private_key }}
      exeris_inbox_app_id: ${{ secrets.exeris_inbox_app_id }}
      exeris_inbox_private_key: ${{ secrets.exeris_inbox_private_key }}
