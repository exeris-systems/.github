# Reusable: run the L2 documentation and hygiene review on a pull request — ADR-085 §J.33,
# ADR-087 §B.
#
# §J.33 places `docs-guardrails-review` as a step inside `pr-review.md`, "a Claude Project document
# maintained outside the git repositories". That is where it still lives, and it is why the review
# has never run on a pull request: each repo's claude-code-review.yml invokes the marketplace
# `/code-review:code-review` prompt, which knows nothing about the routine. The L2 layer of ADR-085
# has therefore existed only inside Cowork sessions since the day it was written — Phase 5 assumes
# it runs on PRs.
#
# This gives it a home in git. The routine text is `docs-guardrails-review.md` in this repository,
# checked out and handed to Claude verbatim, so there is exactly one copy and changing it changes
# every repository at once.
#
# PRODUCE AND PUBLISH ARE TWO JOBS, AND ONLY THE SECOND WRITES (ADR-087 §B.5). The produce job runs
# the model and writes a verdict; the publish job posts it, labels the pull request and is the
# required check. The split is not cosmetic: every write goes through the `exeris-bot` installation
# token, so neither job's own GITHUB_TOKEN needs a write scope, and the step that executes
# model-generated commands holds none. A caller's permission block therefore does not change.
#
# A reviewed pull request ends up with TWO comments, and that is not an accident. The runner posts
# its own review — that is the artefact §B.10's fallback reads when no file was written — and the
# publish job posts the verdict under the organisation's byline, edited in place on every later push.
# The runner's comment is the production; the bot's is the publication, and it is the one the labels
# and the required check follow.
#
# The routine, the schema and the label map are read from `exeris-systems/.github`'s DEFAULT BRANCH,
# never from the pull request under review — including when this repository reviews itself. A pull
# request that rewrites the contract is judged by the contract that is in force, which is the only
# reading under which a red result means anything.
name: docs-review
on:
  workflow_call:
    inputs:
      extra-paths:
        type: string
        default: ""
        description: "Additional path globs that should trigger the docs review, one per line"
      runner:
        type: string
        default: "claude-code-action"
        description: >-
          Which runner produces the verdict. A configuration point, not a decision point
          (ADR-087 §B.12): a human sets it in the caller, the publish step records what ran and
          selects nothing. One value is supported today; the input exists so that adding a second
          is a caller edit rather than a workflow rewrite.
      publish:
        type: boolean
        default: false
        description: >-
          Whether the verdict is published and gated. OFF by default, and deliberately: until a real
          run has shown whether the runner writes `verdict.json` and what identity it posts under
          (ADR-087 Engineering Protocol 4), the publish job has one possible source of a verdict and
          nobody knows whether it produces one. Switching it on for every caller at merge would put
          an unexplained red or green on pull requests in repositories that did not ask for it.
          `exeris-systems/.github` turns it on for itself first; a caller turns it on when the
          answers exist.
      l1-results:
        type: string
        default: ""
        description: >-
          What the caller's L1 gates concluded, as `{"docs-lint": "success", …}`, built from the
          caller's own `needs`. Two uses, and both were learned the hard way. The model is HANDED
          them instead of being asked to read a step summary it cannot reach — the first real run
          reported all three mandatory gates as `not-run` for that reason and the required check was
          red for ever. And the publish step decides on them rather than on the review's reading of
          them, because the workflow that ran a gate knows what it concluded.
      review-label:
        type: string
        default: "needs-l2-review"
        description: >-
          The label a human applies to ask for a review. A label rather than a comment mention: one
          click instead of writing, an event the caller already receives, and no new permission
          surface — `issue_comment` would raise who may spend a paid model run by commenting on a
          public repository. The publication removes it once the review has run.
      mandatory-gates:
        type: string
        default: ""
        description: >-
          Comma-separated L1 gates whose `not-run` makes the required check red (ADR-087 §B.8).
          Empty means the routine's own list. Name more here in a repository whose caller runs more.
    secrets:
      claude_code_oauth_token: { required: true }
      # OPTIONAL, and that is a compatibility statement as much as a design one. `exeris-sdk` and
      # `exeris-tooling` track this workflow at `@main` and pass secrets BY NAME, not by inheriting;
      # a new required secret would stop their whole guardrails file parsing on the merge commit,
      # which is the failure `caller_permissions_check.py` exists because of. It is also what
      # ADR-087 Engineering Protocol 1 asks for: items 2-3 land "and run under the provider's
      # identity until the Apps exist".
      #
      # Without them the review is not published and no label moves; the required check still
      # decides. Publication degrades, the gate does not.
      exeris_bot_app_id: { required: false }
      exeris_bot_private_key: { required: false }
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  produce:
    runs-on: ubuntu-latest
    # Drafts and dependency bumps are not reviewed, matching claude-code-review.yml and
    # pr-conventions.md rule 6.
    # THIS CONDITION IS ALSO WHAT HOLDS §C.14a's TRIGGER CLOSED, and that is worth saying because
    # nothing else here does. The produce job runs the model on the pull request's HEAD checkout,
    # which includes its `AGENTS.md`, its `.agents/**` and its provider adapters — the instruction
    # files the runner reads. §C.14a requires those to be restored from the merge base whenever the
    # author is not a member of the organisation, and that is NOT implemented. Today no outside pull
    # request reaches the runner at all, because of the line below. Anything that changes that —
    # `pull_request_target`, or reviewing forks — must implement §C.14a first, in the same change.
    #
    # A fork's pull request receives no secrets, so the runner has no credential and the review
    # cannot happen. Skipped deliberately rather than left to fail: a permanent red on every
    # community pull request would make `exeris-kernel`'s open-core promise unmergeable, and a
    # required check that can never pass is not a gate, it is a wall. The path that reviews a fork
    # safely is `pull_request_target` with the risk analysis that deserves, and it is not this
    # pull request's.
    # A LABEL CHANGE MUST NOT START A REVIEW, because the publication applies labels. Measured: the
    # publish step added `doc-debt` at 20:12:17 and a new run began at 20:12:20 with `exeris-bot` as
    # its actor; the runner refuses a non-human actor, so the produce job failed and the publish job
    # replaced a comment carrying real findings with "no verdict". The publication destroyed itself
    # in three seconds. A label change alters no diff, so there is nothing to review either way.
    #
    # THE L1 CONDITION IS THE ORDERING, not a dependency. A review judges what the gates cannot, so
    # running it on a pull request whose commit message does not lint spends eight minutes of a model
    # to repeat what a script already said. The caller waits on its gates and hands their results in;
    # this skips the model when any of them is not green, and the publish half reports that skip as
    # RED with the failing gates named — a job result cannot tell "the gates failed" from "there was
    # nothing to review", and those mean opposite things.
    #
    # The actor condition is the same guard from the other side: any bot-initiated run would be
    # refused by the runner and end as a failed produce, which is a red required check for a reason
    # that has nothing to do with the pull request.
    # THE REVIEW RUNS ON READINESS (ADR-087, amended 2026-09-16). A verdict is about the commit it
    # read, and reviewing every push did not honour that so much as hide it — the verdict was fresh
    # by accident. A human says when the work is ready: by opening it, reopening it, marking it ready
    # for review, or applying the label. A push afterwards starts nothing and leaves the standing
    # verdict visibly covering an older commit, which the publish half reports as red.
    #
    # The label is the ONLY `labeled` event that starts a review. The bot never applies it, which is
    # what keeps the publication from triggering itself; every other label change, the bot's own
    # included, falls through to `not-ready`.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false &&
      !contains(inputs.l1-results, '"failure"') &&
      !contains(inputs.l1-results, '"cancelled"') &&
      !endsWith(github.actor, '[bot]') &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action == 'opened' ||
       github.event.action == 'reopened' ||
       github.event.action == 'ready_for_review' ||
       (github.event.action == 'labeled' && github.event.label.name == inputs.review-label))
    outputs:
      relevant: ${{ steps.relevant.outputs.any_changed }}
      verdict-written: ${{ steps.wrote.outputs.yes }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Fetch the review routine (exeris-systems/.github)
        uses: actions/checkout@v7
        with: { repository: exeris-systems/.github, path: .guardrails }
      - name: Does this pull request touch documentation or Javadoc?
        id: relevant
        uses: tj-actions/changed-files@v47
        with:
          # Java is in the list because half the routine is Javadoc contract prose (steps 16-20).
          files: |
            **/*.md
            **/*.java
            ${{ inputs.extra-paths }}
      - name: Docs and hygiene review
        id: review
        if: ${{ steps.relevant.outputs.any_changed == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          prompt: |
            Review pull request ${{ github.event.pull_request.number }} in
            ${{ github.repository }} against the documentation and hygiene review routine in
            `.guardrails/docs-guardrails-review.md`. Read that file first and follow it exactly:
            its steps, its severity tags, and its output format.

            The L1 gates have already run and their results are below. Do not try to fetch them —
            this runner's harness denies network calls, and a review that reports them as `not-run`
            because it could not read a page is a review defeated by its own sandbox. Put these
            verbatim into `checks_run`, and do not restate in prose what a gate already reported:
            review the substance those gates cannot judge.

            L1 GATE RESULTS: ${{ inputs.l1-results }}

            Report nothing you have not checked against the repository: the routine asks whether
            documentation matches the code, which means opening the code.

            Close as the routine's `## Verdict` section requires: write the verdict object to
            `verdict.json` in the root of this checkout, and repeat the same object as a fenced
            `json` block at the end of the review you post. The schema it must satisfy is
            `.guardrails/.agents/schemas/verdict.schema.json` — read it from there, not from this
            repository's own `.agents/`, which is a different contract. If you cannot write files,
            the fenced block alone is the stated fallback and the review is still complete.

            Post one review comment. If every step passes, say so in one line rather than
            summarising the routine back.
      # TWO artefacts, not one with two paths. `upload-artifact@v4` roots an artefact at the least
      # common ancestor of the paths it is given: `verdict.json` sits in the workspace and the
      # runner's execution log in RUNNER_TEMP, so their LCA is `/home/runner/work` and the verdict
      # arrives as `<repo>/<repo>/verdict.json` — a path the publish job does not look at, silently,
      # and only when the review SUCCEEDED and produced a log. The happy path was the broken one.
      #
      # `if-no-files-found: ignore` is ADR-087 §B.10 made operational: a runner that cannot write
      # files produces no artefact, and the publish job says so rather than failing here.
      # Whether the runner managed to write the file at all. Today's harness denies the `Write` call,
      # so it never does — and the publish job was downloading an artefact that is never there,
      # printing `Error: Artifact not found` in the middle of every green run. A log that cries wolf
      # on a passing run teaches people to read it selectively, which is the habit that cost this
      # project several hours in one evening. The path stays wired for a runner that can write one.
      - name: Did the runner write a verdict?
        id: wrote
        if: ${{ !cancelled() && steps.relevant.outputs.any_changed == 'true' }}
        run: echo "yes=${{ hashFiles('verdict.json') != '' }}" >> "$GITHUB_OUTPUT"
      - name: Keep the verdict for the publish job
        if: ${{ !cancelled() && steps.relevant.outputs.any_changed == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: l2-verdict-${{ github.event.pull_request.number }}
          path: verdict.json
          if-no-files-found: ignore
          retention-days: 7
      # Separate, because §C.14 wants the execution log as its own artefact with its own digest when
      # the capture step arrives, and because it is the only way the verdict keeps its own path.
      - name: Keep the runner's execution log, if it exposed one
        if: ${{ !cancelled() && steps.review.outputs.execution_file != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: l2-execution-${{ github.event.pull_request.number }}
          path: ${{ steps.review.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: produce
    # `inputs.publish` is the staging of ADR-087 Engineering Protocol 1, not a feature flag: items
    # 2-3 land before the Apps and before the experiment, and a caller adopts the gate when there is
    # something known to adopt.
    # `always()` is what makes the gate fail-closed: a produce job that crashed, timed out or was
    # cancelled must still reach a publish job that finds no verdict and goes red. Without it the
    # required check would be skipped, and a skipped required check is green.
    if: ${{ always() && inputs.publish }}
    # The publishing half is its own reusable workflow because §B.11 requires more than one producer
    # to reach it: a repository's own `claude-code-review.yml` calls it with the same inputs and its
    # own `schema`, and both reviews then publish under one identity and one label map.
    uses: exeris-systems/.github/.github/workflows/publish-verdict.yml@main
    with:
      verdict-artifact: >-
        ${{ needs.produce.outputs.verdict-written == 'true'
            && format('l2-verdict-{0}', github.event.pull_request.number) || '' }}
      execution-artifact: l2-execution-${{ github.event.pull_request.number }}
      expect-agent: exeris-org-docs-reviewer
      runner: ${{ inputs.runner }}
      routine: docs-guardrails-review.md
      mandatory-gates: ${{ inputs.mandatory-gates }}
      l1-results: ${{ inputs.l1-results }}
      review-label: ${{ inputs.review-label }}
      # Why the producing job did not run, as a value the publish half branches on. `ready` is a
      # sentinel rather than the empty string on purpose: GitHub treats `''` as FALSE, so
      # `(readiness) && ''` falls through to the next `||` and every ready run would report as
      # `not-ready`. Found by reading the expression back, before it ran.
      #
      # `draft-or-bot` asks about the PULL REQUEST — is it a draft, was it opened by a bot — and it
      # used to ask `github.actor`, which is who triggered THIS EVENT. The two differ exactly when
      # the publication applies a label: the bot's label change starts a run whose actor is the bot
      # on a pull request a person opened, that run was classified `draft-or-bot`, and a
      # `draft-or-bot` skip is a green. Measured on #40, where a BLOCKED verdict and a `hard-block`
      # label sat on a pull request GitHub reported as CLEAN. The actor now yields `bot-event`,
      # which decides nothing itself and hands the colour to the standing verdict.
      skip-kind: >-
        ${{ github.event.pull_request.head.repo.fork && 'fork'
            || (github.event.pull_request.draft
                || endsWith(github.event.pull_request.user.login, '[bot]')) && 'draft-or-bot'
            || endsWith(github.actor, '[bot]') && 'bot-event'
            || (github.event.action == 'opened' || github.event.action == 'reopened'
                || github.event.action == 'ready_for_review'
                || (github.event.action == 'labeled'
                    && github.event.label.name == inputs.review-label)) && 'ready'
            || 'not-ready' }}
      produce-outcome: ${{ needs.produce.result }}
      produce-relevant: ${{ needs.produce.outputs.relevant }}
      # Three conditions skip the producing job and the reason named two of them, so a fork was
      # recorded as a draft. The plan is supposed to say which skip it was.
      skip-reason: >-
        ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled')
            && 'the event was a label change, which alters no diff — and the publication applies labels, so reviewing on one would have the review trigger itself'
            || endsWith(github.actor, '[bot]')
            && 'the run was started by a bot, and the runner refuses a non-human actor'
            || github.event.pull_request.head.repo.fork
            && 'the pull request comes from a fork, which receives no secrets, so the runner has no credential to review with'
            || 'the pull request is a draft or a dependency bump, which this review does not read' }}
    # Named rather than inherited: `exeris-kernel` and `exeris-sdk` both refused `secrets: inherit`
    # under SonarCloud S7631, and the caller example follows what they do rather than what would be
    # shorter. An absent secret arrives as an empty string and the publish half says so.
    secrets:
      exeris_bot_app_id: ${{ secrets.exeris_bot_app_id }}
      exeris_bot_private_key: ${{ secrets.exeris_bot_private_key }}
