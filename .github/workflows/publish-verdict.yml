# Reusable: publish one L2 review verdict under the organisation's identity — ADR-087 §B.5-B.11.
#
# THE PRODUCER IS INTERCHANGEABLE AND THE PUBLICATION IS ONE. §B.11 puts a repository's own routine
# and the organisation's on the same pull request, and requires both to publish "under one identity
# and one contract". That is only possible if the publishing half is callable from more than one
# producer, so it lives here rather than inside `docs-review.yml`: that workflow calls it, and a
# repository's own `claude-code-review.yml` can call it with the same inputs.
#
# It posts, it labels, and it is the required check. It reads no diff, runs no model and reorders no
# finding — §E.23. Everything it decides is decided by `publish_verdict.py plan`, which touches no
# network and is exercised case by case by `publish_verdict_suite.py` in this repository's own CI.
#
# WHICH SCHEMA VALIDATES. `.github`'s composed schema narrows `agent` to `exeris-org-docs-reviewer`,
# so a verdict from `kernel-pr-review.md` — `agent: exeris-evaluator` — does not validate against it
# and must not be asked to. A producer running its own routine passes its own composed schema in
# `schema`; the default is the organisation's. ADR-087 §B.6a fixes where the BASE comes from and does
# not say whose COMPOSITION validates, because it was written with one producer in mind. This input
# is that extension, and the amendment naming it is owed in `exeris-docs`.
name: publish-verdict
on:
  workflow_call:
    inputs:
      verdict-artifact:
        type: string
        default: ""
        description: "Artifact holding verdict.json, and the runner's execution log where it exposed one"
      schema:
        type: string
        default: ".guardrails/.agents/schemas/verdict.schema.json"
        description: >-
          The composed schema the verdict must satisfy. The organisation's by default; a producer
          running its own routine passes its own, e.g. `caller/.agents/schemas/verdict.schema.json`.
      labels-map:
        type: string
        default: ".guardrails/labels-from-verdict.json"
      mandatory-gates:
        type: string
        default: ""
        description: "L1 gates whose `not-run` is red (ADR-087 §B.8). Empty means the routine's own list."
      runner:
        type: string
        default: ""
        description: "What produced the verdict, recorded in the footer and never selected on"
      routine:
        type: string
        default: ""
        description: "The routine file the producer ran, named in the provenance footer (§A.3)"
      produce-outcome:
        type: string
        required: true
        description: "The producing job's `result`. `skipped` is the only value that is green without a verdict."
      produce-relevant:
        type: string
        default: "true"
        description: "`false` when a deterministic path filter decided there was nothing to review"
      skip-reason:
        type: string
        default: ""
        description: "Which skip it was, when the producing job was skipped rather than run"
    secrets:
      exeris_bot_app_id: { required: true }
      exeris_bot_private_key: { required: true }
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  # The job name is the last segment of the check name, and the check name is what a branch
  # protection rule names. Through `docs-review.yml` this reads `docs-review / publish / verdict`;
  # called straight from a repository's own `guardrails.yml` it reads `<job> / verdict`. CONFIRM THE
  # NAME AGAINST A REAL RUN BEFORE MAKING IT REQUIRED — a required check whose name does not exist
  # never reports, and a pull request waiting on one can never merge.
  verdict:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the contract (exeris-systems/.github, default branch)
        uses: actions/checkout@v4
        with: { repository: exeris-systems/.github, path: .guardrails }
      - name: The SHA the contract was read at
        id: contract
        run: echo "sha=$(git -C .guardrails rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check the reviewed repository's agent tree out
        uses: actions/checkout@v4
        with: { path: caller, sparse-checkout: .agents, sparse-checkout-cone-mode: false }
        continue-on-error: true
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pyyaml jsonschema referencing
      - name: The verdict the producing job left, if it left one
        if: ${{ inputs.verdict-artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.verdict-artifact }}
          path: produced
        continue-on-error: true
      # Read with the job's own token, which holds `pull-requests: read` and nothing more. This is
      # the fallback source of §B.10, and it is also where the arbiter reads what another routine
      # has already published.
      - name: The reviews already on this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[]'
            gh api "repos/$REPO/pulls/$PR/reviews"  --paginate --jq '.[]'; } \
            | jq -s '.' > comments.json
      - name: Mint the exeris-bot token
        id: bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.exeris_bot_app_id }}
          private-key: ${{ secrets.exeris_bot_private_key }}
      # Every caller-controlled value reaches the shell through `env`, never through `${{ }}` inside
      # the script: a label named `"; rm -rf /` is a thing a person can create, and a run block that
      # interpolates one is how it executes.
      - name: Plan the publication
        env:
          OUTCOME: ${{ inputs.produce-outcome }}
          RELEVANT: ${{ inputs.produce-relevant }}
          RUNNER: ${{ inputs.runner }}
          ROUTINE: ${{ inputs.routine }}
          SCHEMA: ${{ inputs.schema }}
          LABELS_MAP: ${{ inputs.labels-map }}
          MANDATORY: ${{ inputs.mandatory-gates }}
          SKIP_REASON: ${{ inputs.skip-reason }}
          CURRENT_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          ROUTINE_SHA: ${{ steps.contract.outputs.sha }}
        run: |
          set -euo pipefail
          outcome="$OUTCOME"
          extra=()
          if [ "$outcome" = "skipped" ]; then
            [ -n "$SKIP_REASON" ] && extra=(--skip-reason "$SKIP_REASON")
          elif [ "$RELEVANT" != "true" ]; then
            outcome="skipped"
          fi
          # The runner's execution log, when the action exposed one. Its name is the action's, not
          # ours. ADR-087 Engineering Protocol 4 asks whether the action exposes it at all — the
          # footer answers that on a real run rather than by prediction.
          log=$(find produced -maxdepth 1 -name '*.json' ! -name 'verdict.json' 2>/dev/null | head -1)
          if [ -n "$log" ]; then extra+=(--execution-log "$log"); fi
          python .guardrails/scripts/publish_verdict.py plan \
            --schema "$SCHEMA" \
            --labels-map "$LABELS_MAP" \
            --out plan.json \
            --verdict produced/verdict.json \
            --comments comments.json \
            --produce-outcome "$outcome" \
            ${extra[@]+"${extra[@]}"} \
            --mandatory "$MANDATORY" \
            --runner "$RUNNER" \
            --routine "$ROUTINE" \
            --routine-sha "$ROUTINE_SHA" \
            --current-labels "$CURRENT_LABELS"
      # The only step that writes, and it writes as `exeris-bot` — the organisation's byline, never
      # a claim that the bot reviewed anything (§A.3).
      - name: Publish the review and apply the labels
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          jq -r '.comment' plan.json > comment.md
          if [ -s comment.md ]; then
            # One comment per ROUTINE, edited in place. Keyed by role because §B.11 has two routines
            # on one pull request, and a single marker would have each overwrite the other's review.
            agent=$(jq -r '.agent // ""' plan.json)
            existing=$(jq -r --arg m "<!-- exeris-bot: l2-verdict agent=$agent " \
              'map(select(.body != null and (.body | contains($m)))) | last | .id // empty' comments.json)
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md --silent
            else
              gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md --silent
            fi
          fi
          # `while read` rather than `for … in $(…)`: a label is allowed to contain a space, and the
          # word split would apply half of one and then fail on the other half.
          jq -r '.labels_add[]' plan.json | while IFS= read -r label; do
            [ -n "$label" ] && gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=$label" --silent
          done
          jq -r '.labels_remove[]' plan.json | while IFS= read -r label; do
            [ -n "$label" ] && gh api -X DELETE \
              "repos/$REPO/issues/$PR/labels/$(jq -rn --arg l "$label" '$l|@uri')" --silent
          done
      # §B.6a: the verdict was written against the reviewed repository's pin and validated against a
      # composition over this repository's. A different MAJOR — or a caller ahead within one — means
      # those are not the same contract. It runs after the review is posted so that the finding
      # arrives beside the review rather than instead of it.
      - name: The reviewed repository's bundle pin against this one's
        if: ${{ !cancelled() && hashFiles('caller/.agents/manifest.yaml') != '' }}
        run: |
          python .guardrails/scripts/caller_bundle_check.py \
            --root .guardrails --caller caller/.agents/manifest.yaml
      - name: The required check
        if: ${{ !cancelled() }}
        run: python .guardrails/scripts/publish_verdict.py gate --plan plan.json
