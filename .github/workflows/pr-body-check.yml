# Reusable: PR template presence and parseability — ADR-085 §E, pr-conventions.md rules 2–4.
name: pr-body-check
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: read
jobs:
  pr-body-check:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: exeris-systems/.github, path: .guardrails }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Did the PR touch docs/adr/**?
        id: adr
        uses: tj-actions/changed-files@v45
        with:
          # Two layouts: repos with code keep ADRs under <repo>/docs/adr/, and exeris-docs, having
          # none, keeps them at the root (ADR-085 §A.1). The first pattern alone never matched the
          # repository that owns the registry.
          files: |
            **/docs/adr/**
            adr/**
      - name: Check PR body
        env:
          GUARDRAILS_ADR_TOUCHED: ${{ steps.adr.outputs.any_changed == 'true' && '1' || '0' }}
        run: python .guardrails/scripts/pr_body_check.py
