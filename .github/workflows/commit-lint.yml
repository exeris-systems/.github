# Reusable: commit-message and PR-title lint — ADR-085 §D, commit-conventions.md.
name: commit-lint
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: read
jobs:
  commit-lint:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v7
        with: { repository: exeris-systems/.github, path: .guardrails }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      # `working-directory: .guardrails` only means what it says because that directory carries a
      # `package.json`. Without one, npm walks UP looking for a project root, finds the CALLER's,
      # and installs into the caller's `node_modules` while writing `@commitlint/*` into the
      # caller's dependency list. The same walk decided how `commitlint.config.js` was parsed: a
      # caller declaring `"type": "module"` made this repository's CommonJS config load as ESM and
      # `commit-lint` died on `module.exports`, in every such caller and only in those.
      #
      # Only a caller with a root `package.json` is affected, which is why the anchor can be absent
      # for a long time without anything saying so. `scripts/commitlint_anchor_repro.sh` builds both
      # states and prints what differs.
      - run: npm install --no-audit --no-fund @commitlint/cli@19 @commitlint/config-conventional@19
        working-directory: .guardrails
      # Advisory, not a gate. Every repository here squash-merges, so the only message that
      # reaches the default branch is the PR title checked below; the branch's own commits are
      # scratch by the time they land. Blocking on them also makes the rule retroactive: a
      # milestone-integration PR carries hundreds of commits written before the convention
      # existed, and history cannot be edited to satisfy a gate added afterwards. On
      # `development/0.12.0` this step is red for 78 of the 90 commits it parses — a permanently
      # red required check teaches people to ignore the check, not to write better messages.
      # It still runs, because the annotations are worth reading on a two-commit PR.
      - name: Lint PR commits (advisory)
        continue-on-error: true
        run: npx --prefix .guardrails commitlint --config .guardrails/commitlint.config.js --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Lint PR title (the squash-commit subject)
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$TITLE" "$BODY" | npx --prefix .guardrails commitlint --config .guardrails/commitlint.config.js --verbose
