# Reusable: commit-message and PR-title lint — ADR-085 §D, commit-conventions.md.
name: commit-lint
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: read
jobs:
  commit-lint:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: exeris-systems/.github, path: .guardrails }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund @commitlint/cli@19 @commitlint/config-conventional@19
        working-directory: .guardrails
      - name: Lint PR commits
        run: npx --prefix .guardrails commitlint --config .guardrails/commitlint.config.js --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Lint PR title (the squash-commit subject)
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$TITLE" "$BODY" | npx --prefix .guardrails commitlint --config .guardrails/commitlint.config.js --verbose
