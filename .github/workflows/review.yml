# Reusable: run the L2 review on a pull request — ADR-085 §J.33, ADR-087 §B. Whole or in parts
# (`pr`, `docs`, `records`, `code-docs`, `code`, `repo`), composed into one verdict.
#
# THE REQUIRED CHECK IS `review / verdict`, when the caller's job is called `review`. A check is
# named `<caller job> / <job>`, one segment for each workflow the run passes through, so the name
# is decided by how many files stand between the caller and the job that holds the steps. `verdict`
# is a job OF THIS FILE, with steps of its own, and not a call to another workflow: a call would
# put a third segment in the name. `docs-review.yml` is a one-job wrapper around this file whose
# job is called `publish`, which is what keeps `docs-review / publish / verdict` byte-identical for
# the callers that have not moved. See ADR-087's amendment on the check name.
#
# §J.33 places `docs-guardrails-review` as a step inside `pr-review.md`, "a Claude Project document
# maintained outside the git repositories". That is where it still lives, and it is why the review
# has never run on a pull request: each repo's claude-code-review.yml invokes the marketplace
# `/code-review:code-review` prompt, which knows nothing about the routine. The L2 layer of ADR-085
# has therefore existed only inside Cowork sessions since the day it was written — Phase 5 assumes
# it runs on PRs.
#
# This gives it a home in git. The routine text is `docs-guardrails-review.md` in this repository,
# checked out and handed to Claude verbatim, so there is exactly one copy and changing it changes
# every repository at once.
#
# PRODUCE AND PUBLISH ARE TWO JOBS, AND ONLY THE SECOND WRITES (ADR-087 §B.5). The produce job runs
# the model and writes a verdict; the `verdict` job posts it, labels the pull request and is the
# required check. The split is not cosmetic: every write goes through the `exeris-bot` installation
# token, so neither job's own GITHUB_TOKEN needs a write scope, and the step that executes
# model-generated commands holds none. A caller's permission block therefore does not change.
#
# A reviewed pull request ends up with TWO comments, and that is not an accident. The runner posts
# its own review — that is the artefact §B.10's fallback reads when no file was written — and the
# `verdict` job posts the verdict under the organisation's byline, edited in place on every later push.
# The runner's comment is the production; the bot's is the publication, and it is the one the labels
# and the required check follow.
#
# The routine, the schema and the label map are read from `exeris-systems/.github`'s DEFAULT BRANCH,
# never from the pull request under review — including when this repository reviews itself. A pull
# request that rewrites the contract is judged by the contract that is in force, which is the only
# reading under which a red result means anything.
name: review
on:
  workflow_call:
    inputs:
      extra-paths:
        type: string
        default: ""
        description: "Additional path globs that should trigger the docs review, one per line"
      runner:
        type: string
        default: "claude-code-action"
        description: >-
          Which runner produces the verdict. A configuration point, not a decision point
          (ADR-087 §B.12): a human sets it in the caller, the publish step records what ran and
          selects nothing. One value is supported today; the input exists so that adding a second
          is a caller edit rather than a workflow rewrite.
      publish:
        type: boolean
        default: false
        description: >-
          Whether the verdict is published and gated. OFF by default, and deliberately: until a real
          run has shown whether the runner writes `verdict.json` and what identity it posts under
          (ADR-087 Engineering Protocol 4), the publish job has one possible source of a verdict and
          nobody knows whether it produces one. Switching it on for every caller at merge would put
          an unexplained red or green on pull requests in repositories that did not ask for it.
          `exeris-systems/.github` turns it on for itself first; a caller turns it on when the
          answers exist.
      l1-results:
        type: string
        default: ""
        description: >-
          What the caller's L1 gates concluded, as `{"docs-lint": "success", …}`, built from the
          caller's own `needs`. Two uses, and both were learned the hard way. The model is HANDED
          them instead of being asked to read a step summary it cannot reach — the first real run
          reported all three mandatory gates as `not-run` for that reason and the required check was
          red for ever. And the publish step decides on them rather than on the review's reading of
          them, because the workflow that ran a gate knows what it concluded.
      review-label:
        type: string
        default: "needs-review"
        description: >-
          The label a human applies to ask for a review. A label rather than a comment mention: one
          click instead of writing, an event the caller already receives, and no new permission
          surface — `issue_comment` would raise who may spend a paid model run by commenting on a
          public repository. The publication removes it once the review has run.
      repo-routine:
        type: string
        default: ""
        description: >-
          A file in the CALLING repository holding that repository's own review rules, e.g.
          `.agents/workflows/docs-pr-review.md`. The routine's `## Repository extension` section
          owns what an extension may do: add checks, raise a severity, forbid what this routine
          permits — never lower a severity, skip a step, or change the output format or the verdict
          schema. Empty means the shared routine and nothing else. This exists because the
          alternative was what every repository actually did: keep a review workflow of its own,
          and with it a second verdict format, no required check and no provenance.
      repo-checks:
        type: string
        default: ""
        description: >-
          A shell command run in the checked-out repository BEFORE the model, e.g.
          `.agents/scripts/drift-sweep.sh; .agents/scripts/taxonomy-check.sh`. Its combined
          output and exit code are handed to the reviewer as a file. CI runs it rather than the
          model because this runner's harness denies Bash — a prompt that asks the model to execute
          a repository's scripts gets a review that reports them as `not-run`, which is what the
          per-repo review workflows this replaces were quietly doing. It never fails the job: most
          repo-local scripts locate candidates rather than decide, so a non-zero exit is evidence
          for the reviewer to judge.
      review-in-parts:
        type: boolean
        default: false
        description: >-
          Whether the routine runs as its parts, one model run each, composed into one verdict. OFF
          by default, and turned on per repository the way publication and capture were: the run
          that proves it works is the first one a repository asks for. Off, the routine runs whole,
          as one leg named `all`. On, a plan reads the changed files and runs `pr` always, `repo`
          when there is an extension, and each other part only where its files are in the diff.
          With capture on, each part's run is its own run record.
      mandatory-gates:
        type: string
        default: ""
        description: >-
          Comma-separated L1 gates whose `not-run` makes the required check red (ADR-087 §B.8).
          Empty means the routine's own list. Name more here in a repository whose caller runs more.
      capture:
        type: boolean
        default: false
        description: >-
          Whether this run becomes a row in the execution dataset (ADR-087 §C.13-§C.17): the
          execution log is committed as a stream, a run record is assembled from what the produce
          job exported, and the row is committed to the inbox's `main`. OFF by default and
          turned on per repository as its own decision, exactly as publication is — a repository
          that starts writing rows starts contributing to a dataset, and the rows a producer writes
          are read by a person before that is asked of anyone else. IT NEEDS `publish: true` TOO:
          the capture job is read from what the `handover` job carries, and `publish: false` skips
          that job, so with publication off this runs nothing. The capture job reads the
          repository and the pull request and writes through an App token, so a caller's permission
          block does not change either way.
    secrets:
      claude_code_oauth_token: { required: true }
      # OPTIONAL, and that is a compatibility statement as much as a design one. `exeris-sdk` and
      # `exeris-tooling` track this workflow at `@main` and pass secrets BY NAME, not by inheriting;
      # a new required secret would stop their whole guardrails file parsing on the merge commit,
      # which is the failure `caller_permissions_check.py` exists because of. It is also what
      # ADR-087 Engineering Protocol 1 asks for: items 2-3 land "and run under the provider's
      # identity until the Apps exist".
      #
      # Without them the review is not published and no label moves; the required check still
      # decides. Publication degrades, the gate does not.
      exeris_bot_app_id: { required: false }
      exeris_bot_private_key: { required: false }
      # The pen, for the capture job below. Optional for the same reason the voice is: a caller
      # that passes secrets by name would have its whole file rejected by a new required one, and a
      # capture with no identity of its own writes nothing rather than writing under another's.
      exeris_inbox_app_id: { required: false }
      exeris_inbox_private_key: { required: false }
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  # WHICH PARTS RUN, decided before any model does. Whole, the answer is the one leg `all`; in parts
  # it is `review_plan.py` over the pull request's files, and every part it does not run is named
  # with the reason, so the aggregate can say "skipped because" rather than go quiet. No model and
  # no secret: the plan is CI's to compute, like the gate results the prompt is handed.
  plan:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      skipped: ${{ steps.plan.outputs.skipped }}
    steps:
      - name: Fetch the review routine (exeris-systems/.github)
        if: ${{ inputs.review-in-parts }}
        uses: actions/checkout@v7
        with: { repository: exeris-systems/.github, path: .guardrails }
      - name: Which parts of the routine this pull request calls for
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
          IN_PARTS: ${{ inputs.review-in-parts }}
          ROUTINE: ${{ inputs.repo-routine }}
        run: |
          set -euo pipefail
          if [ "$IN_PARTS" != "true" ]; then
            echo 'parts=["all"]' >> "$GITHUB_OUTPUT"
            echo 'skipped={}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$PR_REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' > files.txt
          python3 .guardrails/scripts/review_plan.py --files files.txt --repo-routine "$ROUTINE"

  produce:
    needs: plan
    runs-on: ubuntu-latest
    # ONE LEG PER PART, and a leg that fails leaves the others running: a part that produced nothing
    # is reported by the aggregate as `missing`, which is the answer, where a cancelled sibling
    # would be a second part missing for a reason that has nothing to do with it.
    #
    # The leg's name is what `exeris-ai-execution` reads: the host names a leg `produce (<part>)`,
    # the reviewing step keeps its name in every leg, and the artefacts carry the part, so a stream
    # is dated by its own leg and its prompt renders its own part.
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    # Drafts and dependency bumps are not reviewed, matching claude-code-review.yml and
    # pr-conventions.md rule 6.
    # ONE BOT IS READ: THE ORGANISATION'S EXECUTION IDENTITY, `exeris-agent[bot]`, and only because
    # §C.14a is implemented below. The produce job runs the model on the pull request's HEAD
    # checkout, which includes its `AGENTS.md`, its `.agents/**` and its provider adapters — the
    # instruction files an agent reads — and a pull request an agent wrote could otherwise rewrite
    # the rules its own review follows. The step `The instruction files this pull request cannot
    # write` puts every one of them back to the base branch's content before the runner starts, for
    # every author, and the runner does the same for its own paths. The two are one change:
    # `principal_check.py` refuses this condition admitting the identity without that step. Every
    # other bot is still not reviewed. A fork is still not reviewed either — it receives no secrets —
    # and `pull_request_target` remains the change that would need its own risk analysis.
    #
    # A fork's pull request receives no secrets, so the runner has no credential and the review
    # cannot happen. Skipped deliberately rather than left to fail: a permanent red on every
    # community pull request would make `exeris-kernel`'s open-core promise unmergeable, and a
    # required check that can never pass is not a gate, it is a wall. The path that reviews a fork
    # safely is `pull_request_target` with the risk analysis that deserves, and it is not this
    # pull request's.
    # A LABEL CHANGE MUST NOT START A REVIEW, because the publication applies labels. A review that
    # ran on the label its own publication had just written would start a run whose actor is the
    # bot, which the runner refuses, and the failed produce would replace a comment carrying real
    # findings with "no verdict" -- the publication undoing itself. A label change alters no diff, so
    # there is nothing to review either way.
    #
    # THE L1 CONDITION IS THE ORDERING, not a dependency. A review judges what the gates cannot, so
    # running it on a pull request whose commit message does not lint spends eight minutes of a model
    # to repeat what a script already said. The caller waits on its gates and hands their results in;
    # this skips the model when any of them is not green, and the publish half reports that skip as
    # RED with the failing gates named — a job result cannot tell "the gates failed" from "there was
    # nothing to review", and those mean opposite things.
    #
    # The actor condition is the same guard from the other side: any bot-initiated run would be
    # refused by the runner and end as a failed produce, which is a red required check for a reason
    # that has nothing to do with the pull request.
    # THE REVIEW RUNS ON READINESS (ADR-087, amended 2026-09-16). A verdict is about the commit it
    # read, and reviewing every push did not honour that so much as hide it — the verdict was fresh
    # by accident. A human says when the work is ready: by opening it, reopening it, marking it ready
    # for review, or applying the label. A push afterwards starts nothing and leaves the standing
    # verdict visibly covering an older commit, which the publish half reports as red.
    #
    # THE PRINCIPAL THAT ASKS IS CHECKED, NOT ASSUMED. "The bot never applies the request label"
    # was a policy, and a policy is a sentence in a comment: nothing refused a run where a bot had.
    # The condition was `contains(labels, review-label)`, true on ANY event while the label sits
    # there — including the publication's own label changes, since it adds a verdict label before it
    # removes the request. That run starts with `exeris-bot` as its actor, the runner refuses a
    # non-human actor, the produce job FAILS, and the publish half replaces findings with "no
    # verdict". The publication destroying itself in three seconds was this, and it was described in
    # this file as prevented while nothing prevented it.
    #
    # `sender.type` is the payload's own answer and it is asked of every trigger, not only the
    # label: opening, reopening and marking ready are readiness signals that mean "a person says so"
    # — read literally, so that a harness cannot send one. With a second App in the organisation
    # that is the difference between a policy and a check.
    #
    # ONLY A `pull_request` EVENT IS A READINESS SIGNAL. A caller also listens to reviews, because an
    # approval by a person is a human review the publishing half reads — but a review changes no
    # diff, and while the request label stands every other clause here would admit one and run the
    # model again on a tree it has already read.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.sender.type == 'User' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false &&
      !contains(inputs.l1-results, '"failure"') &&
      !contains(inputs.l1-results, '"cancelled"') &&
      (!endsWith(github.event.pull_request.user.login, '[bot]') ||
       github.event.pull_request.user.login == 'exeris-agent[bot]') &&
      (github.event.action == 'opened' ||
       github.event.action == 'reopened' ||
       github.event.action == 'ready_for_review' ||
       contains(github.event.pull_request.labels.*.name, inputs.review-label))
    # THE ALLOW-LIST IN ONE PLACE, because two consumers read it and a second copy is a second
    # answer. It is what the runner is launched with AND it is half of `execution.tool_surface`,
    # the digest that says which powers two rows were compared under; a surface hashed from a
    # literal beside the launch agrees with the launch only for as long as nobody edits one of them.
    #
    # The list is what reading a pull request takes and nothing else. Widening it widens what the
    # shared review may do in every repository that calls this workflow, and it moves the digest,
    # which is a fence.
    env:
      ALLOWED_TOOLS: "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)"
    outputs:
      # Constant, and kept rather than dropped: `publish_verdict.py` reads it and its `false`
      # branch is a green without a verdict. A produce job that runs now always runs the model, so
      # the branch is unreachable from here — and it stays in the publish half as the guard it is
      # for any other producer that calls it.
      relevant: 'true'
      verdict-written: ${{ steps.wrote.outputs.yes }}
      # A JOB output, because a caller can only gate on one. The execution log's existence lived in
      # a STEP output, so the publish half was handed an artefact name whatever happened here and
      # its `!= ''` guard could not be false. A guard whose condition cannot fail is not a guard.
      execution-written: ${{ steps.review.outputs.execution_file != '' }}
      # What the run WAS — its digests, SHAs, version, start and the id of its execution log — is not
      # a job output: a matrix leaves an output to whichever leg wrote it last, so it could describe
      # one run at most. Each leg uploads its own as `l2-surface-<pr>-<part>`, below.
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Fetch the review routine (exeris-systems/.github)
        uses: actions/checkout@v7
        with: { repository: exeris-systems/.github, path: .guardrails }
      # WHICH of the routine's file-scoped steps apply — not WHETHER the routine runs. The routine
      # is Step 1b of the PR-review router and the router's own heading is "Docs & hygiene review
      # (ALL PRs)": its `pr` part judges the pull request BODY against the diff, and its commits.
      # That needs no `.md` in the diff, and the parts that do — `docs`, `records`, `code-docs`,
      # `code` — already find nothing and say nothing when there is nothing to find.
      #
      # Gating the whole routine on this list meant a pull request with no documentation in it got no
      # review of its body at all. Measured 2026-09-17: of five pull requests opened that day, three
      # were never read — including one that rewrote what the reviewer itself is allowed to run, and
      # every one of `exeris-ai-execution`'s three, the repository holding the dataset contract.
      # Half the findings the reviewed two received were findings about their bodies, which
      # the unreviewed three would have earned just as well.
      - name: Which of this routine's file-scoped steps apply?
        id: relevant
        uses: tj-actions/changed-files@v47
        with:
          # Java is in the list because half the routine is Javadoc contract prose (steps 16-20).
          files: |
            **/*.md
            **/*.java
            ${{ inputs.extra-paths }}
      # The repository's own checks, run HERE rather than by the model, for the reason the input's
      # description gives: the harness denies Bash. CI can run them, so CI runs them and hands the
      # output over — the same shape as `l1-results`, where the workflow that ran a gate is the one
      # that says what it concluded.
      #
      # It cannot fail the job. `set +e` and a trailing `echo` mean the step's own exit status is
      # zero whatever the scripts returned; the code is written INTO the file so the reviewer sees
      # it. A candidate locator exiting non-zero is not a verdict, and a step that went red here
      # would skip the review that was supposed to judge the finding.
      # THE ROUTINE SUPPLIES THE INTERPRETER; THE CALLER NAMES THE PACKAGES. Without this the step
      # below ran under the runner image's system `python3`, where `pip install jsonschema` reports
      # "already satisfied" against whatever apt left there and installs nothing. The caller's list
      # was therefore honoured in name and not in version: `publish_verdict_suite.py` failed 57 of
      # its 129 cases on `Draft202012Validator(..., registry=)`, a keyword that arrived in
      # jsonschema 4.18, and the reviewer was handed that as the state of the repository.
      #
      # A caller's list is honoured in name and not in version without this: naming a package is not
      # resolving it, and `pip install` against a system interpreter reports whatever is already
      # there as satisfied. A caller cannot close that — it does not own this job — so the split is:
      # this workflow guarantees a managed interpreter with a working `pip`, and `repo-checks` says
      # what to put in it.
      # Only in the legs that judge the extension: its output is evidence for the repository's own
      # rules, and running it in every leg would run the same scripts once per part for nobody.
      - uses: actions/setup-python@v7
        if: ${{ inputs.repo-checks != '' && (matrix.part == 'all' || matrix.part == 'repo') }}
        with: { python-version: "3.14" }
      - name: This repository's own checks
        if: ${{ inputs.repo-checks != '' && (matrix.part == 'all' || matrix.part == 'repo') }}
        env:
          # Through the environment, not spliced into `run:`. The value comes from a caller's
          # workflow file rather than from pull-request content, but a command assembled by string
          # substitution is the shape of the injection bug regardless of who wrote it today.
          REPO_CHECKS: ${{ inputs.repo-checks }}
        run: |
          set +e
          bash -c "$REPO_CHECKS" >repo-checks.out 2>&1
          code=$?
          printf '\n--- repo-checks exit code: %s ---\n' "$code" >>repo-checks.out
          echo "::notice::this repository's own checks exited $code; the reviewer reads repo-checks.out"
      # The reviewer does not call GitHub. CI does, over REST, and hands the result over — the same
      # shape as `l1-results` above and `repo-checks.out` beside it.
      #
      # REST rather than `gh pr view`: the porcelain wraps GraphQL and asks for fields the task never
      # needs, so it breaks on deprecations that have nothing to do with the request, and it breaks
      # in ways that do not look like failure. Measured 2026-09-17: `gh pr edit --add-label` returned
      # a `Projects (classic)` GraphQL deprecation and DID NOT APPLY THE LABEL, and
      # `gh pr checks --json` is not a flag this `gh` carries. Neither read as "this did not work".
      #
      # Handing the data over is the stronger form of that rule than allowing the call would be. A
      # reviewer with no GitHub access cannot reach it wrongly; the fields are identical on every
      # review instead of being whatever the model thought to ask for; and 64 denied `gh pr view`
      # calls across the logs these repositories held that day were followed by `find /`, `printenv`,
      # `curl` and `WebFetch` — a model improvising its way to data nobody had given it.
      - name: The pull request, read by CI and handed over
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$PR_REPO/pulls/$PR_NUMBER" > pr.api.json
          gh api --paginate "repos/$PR_REPO/pulls/$PR_NUMBER/files" > pr.files.json
          jq -n --slurpfile pr pr.api.json --slurpfile files pr.files.json '{
            number:  $pr[0].number,
            title:   $pr[0].title,
            body:    $pr[0].body,
            author:  $pr[0].user.login,
            draft:   $pr[0].draft,
            base:    {ref: $pr[0].base.ref, sha: $pr[0].base.sha},
            head:    {ref: $pr[0].head.ref, sha: $pr[0].head.sha},
            labels:  [$pr[0].labels[].name],
            files:   [$files[][] | {path: .filename, status: .status,
                                    additions: .additions, deletions: .deletions}]
          }' > pull-request.json
          rm -f pr.api.json pr.files.json
          echo "::notice::pull-request.json: $(jq '.files | length' pull-request.json) changed file(s)"
      # THE GATE RESULTS IN THE VERDICT'S OWN VOCABULARY. The prompt hands these over and says to
      # put them in `checks_run` verbatim. They were handed over in GitHub's words — `success`,
      # `failure`, `cancelled` — and `verdict.base.schema.json` requires `pass`, `fail`, `not-run`
      # under a `check` key. A model that followed the instruction literally produced a verdict the
      # schema refused, which is `decision=INVALID` and a red check saying the runner emitted
      # something unreadable. The failure is intermittent by nature: a model that translates on its
      # own initiative produces a valid verdict and one that obeys the instruction does not, so the
      # contradiction reads as runner variance rather than as two files disagreeing.
      #
      # Translating here rather than asking the model to translate: the vocabulary is CI's to know,
      # the mapping is three cases, and an instruction that says `verbatim` is either true or it is
      # a trap. `cancelled`, `skipped` and an absent result all mean the gate reported nothing,
      # which is exactly what `not-run` is for.
      # WHAT THE REVIEWER MAY READ FROM THE BRANCH, and what it may not. Two facts, both derived
      # from the pull request rather than stated as a rule the model has to remember.
      #
      # THE EXTENSION AT THE BASE. The shared routine is fetched from the organisation repository's
      # default branch so a pull request cannot rewrite the rules it is judged by. A repository's
      # own extension was read from the reviewed checkout, which is the branch: a pull request could
      # add a rule and be judged under it, and -- the direction that matters -- remove one and be
      # judged without it. It is taken at the base commit for the same reason the routine is taken
      # at `main`, and a pull request that adds an extension is not judged by it, which is the same
      # cost that decision already carries.
      #
      # RESTORED PATHS. The runner reads its own configuration from the checkout, so before it
      # starts it restores every path below from the base branch, whatever the pull request did to
      # them, and keeps what the pull request wrote in `.claude-pr/<path>` without executing it. A
      # reviewer reading one of those paths sees content the change does not contain, and a
      # finding about it describes the checkout rather than the diff. Naming the paths is cheaper
      # than asking the model to remember a rule, and it is per-run rather than general.
      - name: The rules this pull request cannot edit, and the files it cannot show
        env:
          ROUTINE: ${{ inputs.repo-routine }}
          # The runner's list, `SENSITIVE_PATHS` in claude-code-action's restore-config.ts: each a
          # path from the root of the checkout, restored whole. `review_inputs_check.py` holds a
          # copy, and the two must agree.
          RESTORED_BY_RUNNER: >-
            .claude .mcp.json .claude.json .gitmodules .ripgreprc CLAUDE.md CLAUDE.local.md .husky
        run: |
          set -euo pipefail
          base=$(jq -r '.base.sha' pull-request.json)
          if [ -n "${ROUTINE:-}" ] && git show "$base:$ROUTINE" > repo-routine.base.md 2>/dev/null; then
            echo "::notice::the repository extension is read at $base, not from this branch"
          else
            rm -f repo-routine.base.md
            [ -n "${ROUTINE:-}" ] && echo "::notice::$ROUTINE does not exist at $base; the reviewer gets no extension"
          fi
          jq -r --arg restored "$RESTORED_BY_RUNNER" '($restored | split(" ")) as $roots
              | .files[].path
              | select(. as $f
                  | any($roots[]; . as $r | $f == $r or ($f | startswith($r + "/"))))' \
            pull-request.json > restored-paths.txt || : > restored-paths.txt
          echo "::notice::$(wc -l < restored-paths.txt) changed path(s) the checkout does not reflect"
      # §C.14a — THE INSTRUCTIONS AN AGENT READS COME FROM THE BASE, whoever wrote the pull request.
      # The runner restores only its own configuration (the list above). `AGENTS.md` at any depth,
      # the bundle tree `.agents/**`, and the other agents' instruction files are read by a model
      # just as surely, and a pull request that edits them would be reviewed under the instructions
      # it wrote — the same reason the extension above is read at the base. Every such path that
      # differs from the base branch is put back to the base branch's content, and one the base does
      # not have is removed; what the branch wrote is kept under `.exeris-pr/<path>` for review and
      # never executed. The paths THIS pull request changed are added to `restored-paths.txt`, so the
      # reviewer is told which files the checkout does not show; a path that differs only because
      # the branch is behind its base is restored and not named, since the pull request did not
      # write it.
      - name: The instruction files this pull request cannot write
        env:
          RESTORED_BY_ORGANISATION: >-
            AGENTS.md .agents GEMINI.md .gemini .codex .cursor .cursorrules .clinerules
            .windsurfrules .github/copilot-instructions.md
        run: |
          set -euo pipefail
          set -f
          base=$(jq -r '.base.sha' pull-request.json)
          specs=()
          for name in $RESTORED_BY_ORGANISATION; do
            specs+=(":(glob)**/$name" ":(glob)**/$name/**")
          done
          # NUL-delimited: a path is read whole whatever characters it carries.
          git diff -z --name-only --no-renames "$base" HEAD -- "${specs[@]}" > instruction-files.txt
          while IFS= read -r -d '' path; do
            if git cat-file -e "HEAD:$path" 2>/dev/null; then
              mkdir -p ".exeris-pr/$(dirname "$path")"
              git show "HEAD:$path" > ".exeris-pr/$path"
            fi
            if git cat-file -e "$base:$path" 2>/dev/null; then
              git checkout -q "$base" -- "$path"
            else
              rm -f -- "$path"
            fi
          done < instruction-files.txt
          git diff --name-only --no-renames "$base...HEAD" -- "${specs[@]}" >> restored-paths.txt
          echo "::notice::$(tr -cd '\0' < instruction-files.txt | wc -c) instruction file(s) read at the base"
          rm -f instruction-files.txt
      # GENERATED COPIES. A renderer's output carries `DO NOT EDIT. Generated from <source>`, and
      # nobody authors it, so a finding about its text is a finding about the source — which the
      # pull request may not carry at all when the source is a bundle's. The list is read from the
      # pull request's commit, because some of these paths were just put back to the base above.
      - name: The generated copies this pull request carries
        run: |
          python3 .guardrails/scripts/generated_paths.py --pr pull-request.json \
            --out generated-paths.txt
      - name: The L1 gate results, in the verdict's vocabulary
        id: gates
        env:
          L1: ${{ inputs.l1-results }}
        run: |
          set -euo pipefail
          if [ -z "${L1:-}" ]; then
            echo 'checks_run=[]' >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$L1" | jq -c '[to_entries[] | {check: .key, result:
              (if .value == "success" then "pass"
               elif .value == "failure" then "fail"
               else "not-run" end)}]' > gates.json
            echo "checks_run=$(cat gates.json)" >> "$GITHUB_OUTPUT"
            rm -f gates.json
          fi
      # THE PROMPT IS RENDERED ONCE, AND THE HASH IS OVER WHAT WAS RENDERED. Written inline on the
      # action it left no artefact of itself: the only way to say afterwards what the runner read
      # was to re-render the template from the workflow file and the inputs and trust that the two
      # renderings agree. A hash over a restatement that is not the prompt is worse than no hash,
      # because it is indistinguishable from one that is.
      #
      # So the text is rendered here, into a file, and the action is handed the same string through
      # a step output. The substitutions are the workflow's own and unchanged; what moved is where
      # they are spent.
      #
      # THE HEREDOC DELIMITER IS QUOTED, so this shell expands nothing inside the body. The `${{ }}`
      # values are substituted before the shell starts, and each is a number, a repository name, a
      # literal chosen by an expression, or one line of `jq -c` output — none of which can open or
      # close a heredoc. The quoting is what keeps a backtick or a `$` in the prompt's own prose
      # from being read as a command.
      #
      # The file keeps a trailing newline and the step output does not, because a heredoc-delimited
      # output ends at its delimiter. The hash cannot see that difference: the contract normalises
      # every component to exactly one trailing newline before concatenating, so the file this
      # hashes and the string the action receives are one component either way.
      - name: The prompt, rendered once
        id: prompt
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/review-prompt.txt" <<'RENDERED_PROMPT'
          Review pull request ${{ github.event.pull_request.number }} in
          ${{ github.repository }} against the documentation and hygiene review routine in
          `.guardrails/docs-guardrails-review.md`. Read that file first and follow it exactly:
          its steps, its severity tags, and its output format.

          PART: ${{ matrix.part }}

          Where PART is `all`, apply the whole routine. Otherwise apply only the part PART names:
          the routine's `## Part` section of that name, or, for `repo`, the REPOSITORY EXTENSION
          below and nothing else. The other parts are judged by runs of their own, and a finding
          about one of them here is a finding reported twice. Every part reads the routine's
          `## Parts`, `## Repository extension`, `## Output format` and `## Verdict` sections. A
          part's verdict carries `"part": "<PART>"`; the whole routine's carries no `part`.
          Every part's verdict carries every field the schema requires, whichever part it is:
          `scope_class` is the pull request's own `Scope class:` line, copied as it stands even
          where judging the classification belongs to another part. A verdict missing it fails
          the schema, and the part is then reported as producing nothing.

          The verdict's top-level fields are these and no others: `agent`, `part`, `decision`,
          `scope_class`, `findings`, `checks_run`, and where the review has them `suggestions`,
          `handoffs`, `decision_label`, `required_validation`. The composed schema reaches the
          base through a `$ref`, so reading it alone does not show the base's fields; a field
          added from memory, a `summary` among them, fails the schema. Put the fenced `json`
          block in the text of your final message, whether or not writing `verdict.json`
          succeeded, rather than pointing at one above.

          Each finding's `why` is the clause it violates as `<file>#<rule>` and nothing else —
          `docs-guardrails-review.md#8`, `repo-review-rules.md#R2`. The explanation belongs in
          `what`; a `why` with prose in it fails the schema and the review is refused.

          Each finding carries `what`, `why` and `fix`. Where it has one site, that site is
          `location`, one string `<path>:<line>`; a finding has no `file` or `line` field, and
          one carrying either fails the schema. A finding that refuses the merge carries
          `"blocking": true` — every `HARD BLOCK` does — and a `BLOCKED` verdict with no such
          finding fails the schema too. The routine's `## Verdict` maps each part of a report
          line to its field.

          The L1 gates have already run and their results are below. Do not try to fetch them —
          this runner's harness denies network calls, and a review that reports them as `not-run`
          because it could not read a page is a review defeated by its own sandbox. Put these
          verbatim into `checks_run`, and do not restate in prose what a gate already reported:
          review the substance those gates cannot judge.

          L1 GATE RESULTS, already in the shape and the vocabulary `checks_run` takes —
          copy them in as they are:

          ${{ steps.gates.outputs.checks_run }}

          The pull request itself is in `pull-request.json` in the root of the checkout: title,
          body, author, labels, base and head, and every changed file with its status. Read it —
          it is the whole of what a `gh` call would have told you, and you have no GitHub access
          to make one with. The diff is the checkout: `git diff` against the base SHA that file
          names.

          The routine's steps are grouped into parts, and each part names the files it applies to:
          `docs`, `records`, `code-docs` and `code` apply to the files in this diff that they name
          and to no others; where the diff has none, they find nothing and you say nothing about
          them. That is not a reason to skip the review. The `pr` part judges the pull request's
          BODY against its diff, its commits and its compatibility claim, and it applies to every
          pull request whatever it changes — the routine is Step 1b of the review router, whose
          heading reads "Docs & hygiene review (ALL PRs)".

          This repository may extend the routine with rules of its own. The routine's
          `## Repository extension` section says how far that goes and what it may not touch;
          read that section before you read the extension. Where a value below is `(none)`,
          there is nothing to apply and this routine stands alone.

          The extension below is this repository's file AS THE BASE COMMIT HAS IT, not as this
          pull request leaves it. A pull request does not get to write the rules it is judged by,
          which is the same reason the routine itself comes from the organisation repository's
          default branch. A pull request that changes the extension is reviewed under the old one
          and takes effect for the next.

          FILES THIS CHECKOUT DOES NOT REFLECT: the paths in `restored-paths.txt`, if any, are
          changed by this pull request and restored to the base branch's content before you
          start — because the runner reads them itself, or because they are instructions an agent
          reads, and a pull request does not write the instructions its review follows. Their
          content at that path is not the change. What the pull request wrote to each is at
          `.claude-pr/<path>` for the runner's own paths and at `.exeris-pr/<path>` for the
          organisation's (`AGENTS.md`, `.agents/**` and other agents' instruction files); a path
          the pull request deleted has no copy. Both are copies kept for review and never
          executed: judge the change from that copy. A file there that begins
          `Snapshot placeholder:` stands for a link the copy did not follow, and says nothing
          about what the link pointed at.

          GENERATED COPIES: the paths in `generated-paths.txt`, if any, carry a do-not-edit header
          naming the file they are generated from, one `<path>` TAB `<source>` per line. Nobody
          authors a copy, so judge its source and not the copy: where the source is in this diff,
          a finding about the text belongs to the source; where it is not, report nothing about
          the copy's content. Whether a copy still matches its source is `docs-lint`'s adapter
          check, not a question for this review.

          REPOSITORY EXTENSION: ${{ inputs.repo-routine != '' && 'repo-routine.base.md' || '(none)' }}
          REPOSITORY CHECK OUTPUT: ${{ inputs.repo-checks != '' && 'repo-checks.out' || '(none)' }}

          The check output is written only for PART `all` and `repo`, the parts that judge the
          extension; for any other part it is not in this checkout, and that is not a finding.

          Report nothing you have not checked against the repository: the routine asks whether
          documentation matches the code, which means opening the code.

          Close as the routine's `## Verdict` section requires: write the verdict object to
          `verdict.json` in the root of this checkout, and repeat the same object as a fenced
          `json` block at the end of the review you post. The schema it must satisfy is
          `.guardrails/.agents/schemas/verdict.schema.json` — read it from there, not from this
          repository's own `.agents/`, which is a different contract. If you cannot write files,
          the fenced block alone is the stated fallback and the review is still complete.

          DO NOT POST ANYTHING. You have no tool that can, and that is deliberate: the review you
          write IS your reply, and the publication step signs it as `exeris-bot`, attaches the
          marker the required check reads, and adds the provenance footer. A review you post
          yourself carries none of those and no check can act on it. If every step passes, say so
          in one line rather than summarising the routine back.
          RENDERED_PROMPT
          {
            echo "text<<RENDERED_PROMPT_OUTPUT"
            cat "$RUNNER_TEMP/review-prompt.txt"
            echo "RENDERED_PROMPT_OUTPUT"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::the reviewer's prompt is $(wc -c < "$RUNNER_TEMP/review-prompt.txt") byte(s)"
      # WHEN THE REVIEW BEGAN, taken here rather than reconstructed afterwards. A row is dated by
      # the run it describes and a fence is dated too, so a row dated by the workflow's start is
      # dated by something else that happened the same day. The step before the model is the closest
      # instant anything in this job can name.
      - name: When the review began
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Docs and hygiene review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          # `exeris-bot` and nothing else. The action refuses a run whose actor is a bot — its own
          # guard, and a reasonable one — and that guard collided with the recovery added in #47:
          # when a ready run loses its gates the publication re-applies the review label, so the run
          # that repairs it is initiated by `exeris-bot`. The action then refused to start and the
          # produce job came out `failure` rather than skipped, which is worse than the state it was
          # repairing: the action refuses to start for a non-human actor and says so, and a failed
          # produce is a red check about the runner rather than about the pull request.
          #
          # Narrow on purpose: one login, not `*`. The bot applies the review label in exactly one
          # place — the lost-request branch of `publish_verdict.py` — and the producing job still
          # requires the pull request's AUTHOR to be human and the pull request to carry the label.
          allowed_bots: "exeris-bot"
          # THE REVIEWER MAY NOT PUBLISH. ADR-087 §A.3 gives publication to `exeris-bot` and
          # nothing else: the bot signs the comment, carries the marker the gate reads, and writes
          # the provenance footer. Without this line the runner publishes its own review instead,
          # under its own identity: a comment with no marker, no footer and no gate -- a review
          # nothing can act on, beside a required check going red because no verdict arrived.
          #
          # Worse than the duplicate: what the shared review may do was being decided by the
          # repository it ran in rather than by this file. The same workflow denied every `gh` call
          # in `exeris-systems/.github` and allowed all of them here, so a repository could have
          # granted its own reviewer the power to publish. A review whose powers vary by target is
          # not a shared review.
          #
          # The list is what reading a pull request takes and nothing else. `verdict.json` is left
          # out on purpose: the routine still asks for it, the Write is refused, and the fenced block
          # in the model's own output is §B.10's stated fallback — which is also the only place the
          # publish half can find a verdict, since a runner that posts writes its verdict into a tool
          # call and reports "Review posted" as its text.
          #
          # ONE STRING, READ TWICE. The list is the job's `ALLOWED_TOOLS`, and the surface step
          # hashes that same variable — so the launch and the digest cannot name different powers.
          claude_args: |
            --allowedTools "${{ env.ALLOWED_TOOLS }}"
          prompt: ${{ steps.prompt.outputs.text }}
      # WHAT THIS RUN WAS, HASHED WHILE IT IS STILL HERE — ADR-087 §C.14, ADR-086 §C.14a.
      #
      # `always()`, because a review that crashed is still a review that was given a prompt, a
      # routine and an allow-list, and those are what this exports. A step that ran only after a
      # success would export nothing for exactly the runs whose conditions a reader most wants to
      # compare.
      #
      # THE SCRIPT COMES FROM THE ORGANISATION CHECKOUT, not from the reviewed tree. It derives the
      # identity of the run that judges this pull request, and read from the branch a pull request
      # could rewrite the derivation that describes it — the same reason the routine itself is
      # fetched from the default branch.
      #
      # NOTHING HERE FAILS THE JOB, and two things hold that rather than one. A component this
      # cannot read costs the hash over that component and no more: an empty value is written, the
      # produce job stays whatever the review made it, and a consumer sees a component it did not
      # get. And the step is `continue-on-error`, because the script it runs comes from another
      # repository's default branch: a checkout that does not carry it yet, or an interpreter that
      # refuses it, would otherwise turn the produce job red about the exporter rather than
      # about the pull request — and hand the publishing half a `produce-outcome` of `failure` for
      # the same reason.
      #
      # THE COMPONENTS ARE READ AT THE HEAD COMMIT, not out of the workspace. The workspace holds
      # the pull request's MERGE tree, base plus branch, and a merge commit is on no branch — so a
      # component hashed from it is a component no later reader can name. A reconstruction reads
      # these files at the head commit and the two are then compared component by component; a base
      # that moved `AGENTS.md` or the settings since the fork point would make the two producers
      # disagree over a component for a reason that is not canonicalisation drift, and that
      # comparison is exactly the thing that cannot tell those two apart. `checkout-sha` and
      # `head-sha` therefore carry one commit and stay two answers: the first names the tree the
      # components were read at, the second names the pull request's head.
      - name: The components this run's identity is derived from
        id: surface
        if: ${{ always() }}
        # The paragraph above, enforced rather than described: an exporter that cannot run leaves
        # the components unexported, which is a state a consumer reads, and never a red job about
        # the exporter itself.
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: |
          set -euo pipefail
          [ -f .guardrails/scripts/review_surface.py ] || {
            echo "::notice::the surface script is not on the routine's default branch, so no components are exported"
            exit 0
          }
          if ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            echo "::notice::the head commit is not in this checkout, so no components are exported"
            exit 0
          fi
          # A path the head tree does not carry is left ABSENT rather than written empty. Absent is
          # a state each of these components has a value for — a repository with no agent file
          # contributes the empty component, one with no settings declares no permission rules —
          # and an empty file is a different tree from a tree without the file.
          surface="$RUNNER_TEMP/surface"
          rm -rf "$surface"
          mkdir -p "$surface/.claude" "$surface/.agents/vendor"
          for path in AGENTS.md .claude/settings.json .agents/manifest.yaml; do
            git show "$HEAD_SHA:$path" > "$surface/$path" 2>/dev/null || rm -f "$surface/$path"
          done
          git ls-tree --name-only "$HEAD_SHA" .agents/vendor/ > "$surface/vendor.txt" 2>/dev/null || true
          while IFS= read -r entry; do
            if [ -n "$entry" ]; then mkdir -p "$surface/$entry"; fi
          done < "$surface/vendor.txt"
          python3 .guardrails/scripts/review_surface.py \
            --prompt "$RUNNER_TEMP/review-prompt.txt" \
            --routine .guardrails/docs-guardrails-review.md \
            --routine-sha "$(git -C .guardrails rev-parse HEAD)" \
            --agents-md "$surface/AGENTS.md" \
            --allowed-tools "$ALLOWED_TOOLS" \
            --settings "$surface/.claude/settings.json" \
            --manifest "$surface/.agents/manifest.yaml" \
            --vendor-dir "$surface/.agents/vendor" \
            --checkout-sha "$HEAD_SHA" \
            --head-sha "$HEAD_SHA" \
            --review-started-at "$STARTED_AT"
      # TWO artefacts, not one with two paths. `upload-artifact@v4` roots an artefact at the least
      # common ancestor of the paths it is given: `verdict.json` sits in the workspace and the
      # runner's execution log in RUNNER_TEMP, so their LCA is `/home/runner/work` and the verdict
      # arrives as `<repo>/<repo>/verdict.json` — a path the publish job does not look at, silently,
      # and only when the review SUCCEEDED and produced a log. The happy path was the broken one.
      #
      # `if-no-files-found: ignore` is ADR-087 §B.10 made operational: a runner that cannot write
      # files produces no artefact, and the publish job says so rather than failing here.
      # Whether the runner managed to write the file at all. Today's harness denies the `Write` call,
      # so it never does — and the publish job was downloading an artefact that is never there,
      # printing `Error: Artifact not found` in the middle of every green run. A log that cries wolf
      # on a passing run teaches people to read it selectively, which is the habit that cost this
      # project several hours in one evening. The path stays wired for a runner that can write one.
      - name: Did the runner write a verdict?
        id: wrote
        if: ${{ !cancelled() }}
        run: echo "yes=${{ hashFiles('verdict.json') != '' }}" >> "$GITHUB_OUTPUT"
      - name: Keep the verdict for the publish job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: l2-verdict-${{ github.event.pull_request.number }}-${{ matrix.part }}
          path: verdict.json
          # NINETY, against the execution log's one, and the asymmetry is the point. A verdict is
          # the review: it is published as a comment the moment this run ends, so nothing in it is
          # withheld by a short retention -- only the MACHINE-READABLE copy is. The comment renders
          # the object as a table and does not repeat it, so once this artefact lapses `checks_run`
          # exists only as a bulleted list and a consumer has to parse prose to read what the
          # publication already had as data.
          #
          # Ninety is GitHub's ceiling for a public repository, which is what makes this the whole
          # of the available answer rather than a chosen number.
          if-no-files-found: ignore
          retention-days: 90
      # Separate, because §C.14 wants the execution log as its own artefact with its own digest when
      # the capture step arrives, and because it is the only way the verdict keeps its own path.
      #
      # ONE DAY, WHICH IS THE FLOOR AND NOT A CHOICE OF CONVENIENCE. This artefact is the only thing
      # here that is not metadata: it carries the assistant's and the user's turns, the review's own
      # reasoning and whatever file content the model read, plus the token usage and cost of the run.
      # `exeris-ai-execution/inbox/README.md` closes the public inbox to that material "in any form"
      # (ADR-087 §H.37) -- and while it lives as an artefact it sits on a PUBLIC repository, refused
      # to anonymous callers but readable by any signed-in GitHub account.
      #
      # It cannot be shorter. `upload-artifact` will not take less than a day, and the artefact
      # cannot be skipped: the model runs in this job, this job may hold no write scope at all
      # (ADR-087's review-time assertion makes granting one a HARD BLOCK), so the log has to reach
      # the publish job somehow and an artefact is the mechanism. Below a day there is only deletion
      # after the capture step has stored it, which costs `actions: write` on every reviewed
      # repository -- the right to delete ANY artefact there, granted by every caller. That decision
      # waits for a capture step that exists; this one does not wait for anything.
      - name: Keep the runner's execution log, if it exposed one
        id: execution-log
        if: ${{ !cancelled() && steps.review.outputs.execution_file != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: l2-execution-${{ github.event.pull_request.number }}-${{ matrix.part }}
          path: ${{ steps.review.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 1
      # WHAT THIS LEG'S RUN WAS, AS DIGESTS, for the capture of this leg. The model runs here and
      # this job holds no write scope, so the prompt it was handed, the routine it ran, the agent
      # file it read and the allow-list it ran under exist nowhere once it ends. This carries their
      # identities out and nothing else: every value is a hash, a commit SHA, a version, a timestamp
      # or the host's id for the execution log — no line of the text itself crosses the job boundary.
      #
      # An ARTEFACT rather than job outputs, because this job is a matrix and an output is whichever
      # leg wrote it last. Each is empty where the surface step could not read what it hashes, which
      # is the honest reading: a consumer knows it did not get that component. Only a leg that kept
      # an execution log leaves one, because a run with no stream is a run with no row.
      - name: The identity of this leg's run, for its capture
        id: identity
        if: ${{ !cancelled() && steps.execution-log.outputs.artifact-id != '' }}
        env:
          ARTIFACT: l2-execution-${{ github.event.pull_request.number }}-${{ matrix.part }}
          ARTIFACT_ID: ${{ steps.execution-log.outputs.artifact-id }}
          PROMPT_SHA256: ${{ steps.surface.outputs.prompt-sha256 }}
          ROUTINE_SHA256: ${{ steps.surface.outputs.routine-sha256 }}
          ROUTINE_SHA: ${{ steps.surface.outputs.routine-sha }}
          AGENTS_MD_SHA256: ${{ steps.surface.outputs.agents-md-sha256 }}
          SYSTEM_PROMPT_SHA256: ${{ steps.surface.outputs.system-prompt-sha256 }}
          TOOL_SURFACE: ${{ steps.surface.outputs.tool-surface }}
          BUNDLE_VERSION: ${{ steps.surface.outputs.bundle-version }}
          CHECKOUT_SHA: ${{ steps.surface.outputs.checkout-sha }}
          SURFACE_HEAD_SHA: ${{ steps.surface.outputs.head-sha }}
          REVIEW_STARTED_AT: ${{ steps.surface.outputs.review-started-at }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/identity"
          jq -n --arg artifact "$ARTIFACT" --arg artifact_id "$ARTIFACT_ID" \
            --arg prompt "$PROMPT_SHA256" --arg routine "$ROUTINE_SHA256" \
            --arg routine_sha "$ROUTINE_SHA" --arg agents "$AGENTS_MD_SHA256" \
            --arg system "$SYSTEM_PROMPT_SHA256" --arg tools "$TOOL_SURFACE" \
            --arg bundle "$BUNDLE_VERSION" --arg checkout "$CHECKOUT_SHA" \
            --arg head "$SURFACE_HEAD_SHA" --arg started "$REVIEW_STARTED_AT" \
            '{artifact: $artifact, "artifact-id": $artifact_id, "prompt-sha256": $prompt,
              "routine-sha256": $routine, "routine-sha": $routine_sha,
              "agents-md-sha256": $agents, "system-prompt-sha256": $system,
              "tool-surface": $tools, "bundle-version": $bundle, "checkout-sha": $checkout,
              "head-sha": $head, "review-started-at": $started}' > "$RUNNER_TEMP/identity/surface.json"
      - name: Keep the identity for the capture job
        if: ${{ !cancelled() && steps.execution-log.outputs.artifact-id != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: l2-surface-${{ github.event.pull_request.number }}-${{ matrix.part }}
          path: ${{ runner.temp }}/identity/surface.json
          if-no-files-found: ignore
          retention-days: 1

  # ONE VERDICT FROM THE PARTS, composed where no model runs. Each leg's verdict is in its own
  # execution log, so this reads the logs the legs uploaded and hands `review_aggregate.py` the plan
  # that says what was expected: a planned part with no usable verdict is `missing`, and the
  # publication refuses to pass a check on an incomplete review. Only the composed verdict goes on;
  # the publish half never sees a single part's log as a verdict source, because a part's PASS is
  # not the pull request's.
  aggregate:
    needs: [plan, produce]
    if: ${{ !cancelled() && inputs.review-in-parts && needs.produce.result != 'skipped' }}
    runs-on: ubuntu-latest
    outputs:
      written: ${{ steps.compose.outputs.written }}
      missing: ${{ steps.compose.outputs.missing }}
      # The `pr` leg's log, for the provenance footer alone: which model and harness ran. Handed on
      # only when a composed verdict exists, so the publish half can never read a verdict out of it.
      footer-log: ${{ steps.compose.outputs.footer-log }}
    steps:
      - name: Fetch the review routine (exeris-systems/.github)
        uses: actions/checkout@v7
        with: { repository: exeris-systems/.github, path: .guardrails }
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      - run: pip install --quiet jsonschema referencing
      # A leg that left no log uploaded no artefact, and a pattern that matches fewer artefacts than
      # there are parts is the ordinary case of a part going missing, not a failure of this job.
      - name: The execution logs the legs left
        uses: actions/download-artifact@v8
        with:
          pattern: l2-execution-${{ github.event.pull_request.number }}-*
          path: logs
        continue-on-error: true
      - name: Compose the parts' verdicts into one
        id: compose
        env:
          PARTS: ${{ needs.plan.outputs.parts }}
          SKIPPED: ${{ needs.plan.outputs.skipped }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          jq -n --argjson parts "$PARTS" --argjson skipped "$SKIPPED" \
            '{parts: $parts, skipped: $skipped}' > plan.json
          args=()
          for part in $(jq -r '.[]' <<<"$PARTS"); do
            log=$(find "logs/l2-execution-$PR_NUMBER-$part" -type f 2>/dev/null | head -1 || true)
            if [ -n "$log" ]; then args+=(--log "$part=$log"); fi
          done
          python3 .guardrails/scripts/review_aggregate.py --plan plan.json \
            --schema .guardrails/.agents/schemas/verdict.schema.json --out verdict.json \
            "${args[@]}"
          if [ -f verdict.json ] && [ -d "logs/l2-execution-$PR_NUMBER-pr" ]; then
            echo "footer-log=l2-execution-$PR_NUMBER-pr" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep the composed verdict for the publish job
        if: ${{ steps.compose.outputs.written == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: l2-verdict-${{ github.event.pull_request.number }}
          path: verdict.json
          retention-days: 90

  # THE HAND-OVER, AS A JOB. The two jobs below were one reusable workflow, `publish-verdict.yml`,
  # and read what the producing half decided as `inputs.*`. The check a branch protection rule names
  # is `<caller job> / verdict`, which makes `verdict` a job of THIS file and not of a workflow it
  # calls (a nested call adds a segment), so the steps live here and read the same names as
  # `needs.handover.outputs.*`. Each output is what the caller used to pass as `with:`, and the
  # ones the producing half never passed carry the default `publish-verdict.yml` declared.
  #
  # `scripts/review_check_name_check.py` compares these two jobs with `publish-verdict.yml` after the
  # one substitution, so the copy cannot drift while both exist. `publish-verdict.yml` stays until
  # the callers pinned to a commit of `docs-review.yml` have moved, because that file reaches it at
  # `@main`.
  handover:
    needs: [plan, produce, aggregate]
    if: ${{ !cancelled() && inputs.publish }}
    # It runs nothing and reads nothing, so it holds nothing, the workflow's `id-token` included.
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      # Whole, the one leg's artefacts, as before; in parts, the composed verdict and the `pr` leg's
      # log for the footer, and nothing else. Every branch ends in `format(...)`, which is never
      # empty, so no falsy middle operand can fall through into the other mode's name.
      #
      # A produce output of a matrix job is whichever leg wrote it last, so in parts nothing here
      # reads one: the aggregate is the job that knows what exists.
      verdict-artifact: >-
        ${{ (inputs.review-in-parts && needs.aggregate.outputs.written == 'true'
             && format('l2-verdict-{0}', github.event.pull_request.number))
            || (!inputs.review-in-parts && needs.produce.outputs.verdict-written == 'true'
                && format('l2-verdict-{0}-all', github.event.pull_request.number))
            || '' }}
      execution-artifact: >-
        ${{ (inputs.review-in-parts && needs.aggregate.outputs.footer-log != ''
             && format('{0}', needs.aggregate.outputs.footer-log))
            || (!inputs.review-in-parts && needs.produce.outputs.execution-written == 'true'
                && format('l2-execution-{0}-all', github.event.pull_request.number))
            || '' }}
      expect-agent: exeris-org-reviewer
      runner: ${{ inputs.runner }}
      routine: docs-guardrails-review.md
      mandatory-gates: ${{ inputs.mandatory-gates }}
      l1-results: ${{ inputs.l1-results }}
      review-label: ${{ inputs.review-label }}
      # Which parts ran, one captured run each (ADR-087 §C.14, ADR-086 §C.14a). Each leg's digests,
      # SHAs, version, start and artefact id are in its own `l2-surface-<pr>-<part>`, which the
      # capture job reads per part — a matrix's job outputs could describe only the leg that wrote
      # them last. `["all"]` for a review run whole.
      capture-parts: ${{ needs.plan.outputs.parts }}
      capture: ${{ inputs.capture }}
      # And whether anything is made of them. Handed straight through, because the decision is the
      # caller's: this workflow neither turns capture on for a repository that did not ask nor off
      # for one that did.
      # Why the producing job did not run, as a value the publish half branches on. `ready` is a
      # sentinel rather than the empty string on purpose: GitHub treats `''` as FALSE, so
      # `(readiness) && ''` falls through to the next `||` and every ready run would report as
      # `not-ready`.
      #
      # These ask about the PULL REQUEST — is it a draft, was it opened by a bot — where `bot-event`
      # below asks who triggered THIS EVENT. The two differ exactly when the publication applies a
      # label: the bot's label change starts a run whose actor is the bot on a pull request a person
      # opened. Classifying that run as being about the pull request makes it a green, which is how
      # a BLOCKED verdict and a `hard-block` label end up on a pull request GitHub reports as CLEAN.
      #
      # `draft` AND `bot-authored` ARE TWO KINDS, not one. They were `draft-or-bot`, one word and
      # one green, and only the draft half earns it: a draft cannot be merged while it stays one, so
      # its colour decides nothing. A pull request opened by a bot CAN be merged, so greening it is
      # a merge gate reporting a pass on a change nothing read. `bot-authored` hands the colour to
      # the standing verdict instead. Skipping the WORK on a dependency bump is a decision about
      # cost and it stays; claiming a pass for it was never part of that decision.
      #
      # `bot-event` now sits ABOVE `ready`, and asks the sender rather than the actor. Below it, a
      # bot's label change on a pull request still carrying the request label was classified
      # `ready` — a review was asked for and produced nothing — on a run that was never allowed to
      # review anything. `bot-event` decides nothing itself and hands the colour to the standing
      # verdict, which is the only honest answer to "a bot touched a label".
      #
      # `review-event` is a review submitted or dismissed. The producing job never runs on one, and
      # it sits above `bot-authored` and `ready` because the event, not the pull request, is what
      # this run has to say something about: whether a person's approval now covers the head. The
      # publishing half hands it to the standing verdict and the standing human review, which is
      # where an approval is read.
      skip-kind: >-
        ${{ github.event.pull_request.head.repo.fork && 'fork'
            || github.event.pull_request.draft && 'draft'
            || github.event_name == 'pull_request_review' && 'review-event'
            || endsWith(github.event.pull_request.user.login, '[bot]')
               && github.event.pull_request.user.login != 'exeris-agent[bot]' && 'bot-authored'
            || github.event.sender.type != 'User' && 'bot-event'
            || (github.event.action == 'opened' || github.event.action == 'reopened'
                || github.event.action == 'ready_for_review'
                || contains(github.event.pull_request.labels.*.name,
                            inputs.review-label)) && 'ready'
            || 'not-ready' }}
      produce-outcome: ${{ needs.produce.result }}
      produce-relevant: ${{ needs.produce.outputs.relevant }}
      # Three conditions skip the producing job and the reason named two of them, so a fork was
      # recorded as a draft. The plan is supposed to say which skip it was.
      skip-reason: >-
        ${{ github.event_name == 'pull_request_review'
            && 'the event was a review, which alters no diff — an approval by a person is read as a human review, and a review starts no run of the model'
            || github.event.sender.type != 'User'
            && 'the event came from a bot, and a review is read only where a person asked for one — the runner refuses a non-human actor in any case'
            || (github.event.action == 'labeled' || github.event.action == 'unlabeled')
            && 'the event was a label change, which alters no diff — and the publication applies labels, so reviewing on one would have the review trigger itself'
            || github.event.pull_request.head.repo.fork
            && 'the pull request comes from a fork, which receives no secrets, so the runner has no credential to review with'
            || endsWith(github.event.pull_request.user.login, '[bot]')
            && github.event.pull_request.user.login != 'exeris-agent[bot]'
            && 'the pull request was opened by a bot, and this review does not read a dependency bump -- which skips the work, not the question'
            || 'the pull request is a draft, which this review does not read and GitHub does not merge' }}
      # What `publish-verdict.yml` defaulted, for the inputs this file never handed over. The
      # `capture-*` digests are empty on purpose: every leg is a part and reads its own artefact.
      bot-login: "exeris-bot[bot]"
      capture-agents-md-sha256: ""
      capture-artifact-id: ""
      capture-bundle-version: ""
      capture-checkout-sha: ""
      capture-head-sha: ""
      capture-prompt-sha256: ""
      capture-review-started-at: ""
      capture-routine-sha: ""
      capture-routine-sha256: ""
      capture-system-prompt-sha256: ""
      capture-tool-surface: ""
      execution-repository: exeris-systems/exeris-ai-execution
      labels-map: .guardrails/labels-from-verdict.json
      override-label: human-reviewed
      streams-repository: exeris-systems/exeris-ai-execution-streams
      verdict-authors: ""
    steps:
      - name: Nothing to run; the outputs above are the hand-over
        run: echo "hand-over for the publishing jobs"

  # THE REQUIRED CHECK, and its name is the contract. A job's check name is `<caller job> / <job
  # name>`, one segment per workflow it passes through, so this job being a job of THIS file is what
  # makes a caller `review` read `review / verdict`. Through `docs-review.yml`, whose one job is
  # called `publish`, the same job reads `docs-review / publish / verdict`: the name the callers
  # that have not moved still require. CONFIRM THE NAME AGAINST A REAL RUN BEFORE MAKING IT
  # REQUIRED — a required check whose name does not exist never reports, and a pull request waiting
  # on one can never merge.
  #
  # `inputs.publish` is the staging of ADR-087 Engineering Protocol 1, not a feature flag: items
  # 2-3 land before the Apps and before the experiment, and a caller adopts the gate when there is
  # something known to adopt.
  #
  # `!cancelled()` and not `always()`. A SKIPPED required check reads as green, so a produce job
  # that failed or was skipped must still reach this job, and `!cancelled()` keeps that: it is
  # false only when the RUN was cancelled, never when a job merely failed. What it stops is a dead
  # run publishing. `always()` is true in a cancelled run too, so every run killed by `concurrency`
  # reached this job, found no verdict and posted a "not run" notice. That notice is a new comment
  # by design — its marker matches only another notice, so a failed run cannot erase findings — and
  # the next real verdict then adopts the newest matching comment, which is that notice, orphaning
  # the verdict comment before it. A cancelled run has nothing to say, and its checks report as
  # cancelled rather than green, so nothing is lost by its silence.
  #
  # `inputs.publish` is repeated here although `handover` is skipped without it: a job that carries
  # a status function in its `if` runs even when a job it needs was skipped.
  verdict:
    needs: handover
    if: ${{ !cancelled() && inputs.publish }}
    # What the workflow this job came from declared, and no more: the review's own block carries
    # `id-token: write` for the runner, which the publishing jobs have never held.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    runs-on: ubuntu-latest
    # WHAT THE PLAN DECIDED, CARRIED OUT OF THE JOB. `verdict_source` is the transport that carried
    # the verdict, which is `execution.verdict_route` on a row and is not constant — a verdict has
    # arrived as a written file and as a fenced block in the runner's own log on one pull request
    # within hours. `conclusion` is this job's own answer, recorded beside the row and never
    # selected on: a row says what a run did, and a capture that wrote rows only for green reviews
    # would be a dataset of the runs that went well.
    outputs:
      verdict-source: ${{ steps.outcome.outputs.verdict-source }}
      conclusion: ${{ steps.outcome.outputs.conclusion }}
    # The caller's own `concurrency` cancels superseded RUNS, and `if: always()` deliberately lets a
    # cancelled run reach this job — so without a group here two pushes in quick succession edit one
    # comment and one label set at the same time. Queued rather than cancelled: the later write is
    # the one that should stand, and cancelling the earlier one mid-write is how half a plan lands.
    concurrency:
      group: publish-verdict-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # `ref` is NAMED, and that is not redundant. `actions/checkout` reads the default branch only
      # for a DIFFERENT repository; pointed at the one the workflow is running in, it takes the
      # triggering SHA — so when `exeris-systems/.github` reviewed itself the contract came from
      # `refs/remotes/pull/N/merge`, which is the pull request proposing to change it. Everything
      # this file says about being judged by the rule in force depends on this line.
      - name: Fetch the contract (exeris-systems/.github@main)
        uses: actions/checkout@v7
        with: { repository: exeris-systems/.github, ref: main, path: .guardrails }
      - name: The SHA the contract was read at
        id: contract
        run: echo "sha=$(git -C .guardrails rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check the reviewed repository's agent tree out
        id: caller
        uses: actions/checkout@v7
        with: { path: caller, sparse-checkout: .agents, sparse-checkout-cone-mode: false }
        continue-on-error: true
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      - run: pip install --quiet pyyaml jsonschema referencing
      - name: The verdict the producing job left, if it left one
        if: ${{ needs.handover.outputs.verdict-artifact != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.handover.outputs.verdict-artifact }}
          path: produced
        continue-on-error: true
      # Read with the job's own token, which holds `pull-requests: read` and nothing more. This is
      # the fallback source of §B.10, and it is also where the arbiter reads what another routine
      # has already published.
      - name: The runner's execution log, if it exposed one
        if: ${{ needs.handover.outputs.execution-artifact != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.handover.outputs.execution-artifact }}
          path: execution
        continue-on-error: true
      - name: The reviews already on this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The author is part of the contract, not decoration: §B.10's fallback is "the fenced block
          # from the review THE RUNNER POSTED", and a pull request is a surface anyone can write to.
          # `source` travels with the id because the two endpoints have separate id spaces — a review
          # id PATCHed against issues/comments edits an unrelated comment or 404s.
          { gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq '.[] | {id, source: "issue-comment", author: .user.login, author_type: .user.type, created_at, body}'
            gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
              --jq '.[] | {id, source: "review", author: .user.login, author_type: .user.type, created_at: .submitted_at, body}'
          } | jq -s '.' > comments.json
      # WHO APPROVED WHICH COMMIT, in the shape the API lists it: the reviewer's login and type, the
      # state, the commit and the time. An approval by a person on the head is a human review, and
      # the planner decides which ones are. Failing to read them is NO APPROVALS, never an error that
      # greens anything: the file is written only once the whole listing arrived, and a step that
      # failed leaves none, which the planner reads as nobody having approved.
      - name: The approvals on this pull request, by whom and on which commit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '.[] | {id, user: {login: .user.login, type: .user.type}, state, commit_id, submitted_at}' \
            | jq -s '.' > reviews.partial.json
          mv reviews.partial.json reviews.json
      - name: Is there an identity to publish under?
        id: identity
        env:
          APP_ID: ${{ secrets.exeris_bot_app_id }}
        run: |
          if [ -n "$APP_ID" ]; then echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::publish_verdict: no exeris_bot_app_id was passed, so this review is not published and no label moves. The required check still decides. Pass exeris_bot_app_id and exeris_bot_private_key from the caller to turn publication on."
          fi
      - name: Mint the exeris-bot token
        id: bot
        if: ${{ steps.identity.outputs.have == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.exeris_bot_app_id }}
          private-key: ${{ secrets.exeris_bot_private_key }}
          # The token is minted with the two scopes this step uses and nothing else. `exeris-bot`
          # holds only these today (ADR-087 §A.1), so this changes nothing now — it is here so that
          # widening the App later does not silently widen the step that runs beside model output.
          # v1 could not express it; v3 can, which is half the reason for the bump.
          permission-issues: write
          permission-pull-requests: write
      # Every caller-controlled value reaches the shell through `env`, never through `${{ }}` inside
      # the script: a label named `"; rm -rf /` is a thing a person can create, and a run block that
      # interpolates one is how it executes.
      # §B.6a. It runs BEFORE the plan and its finding is handed to the planner rather than failing
      # a step of its own: a second red beside the gate is a red the pull request's author cannot
      # tell from BLOCKED, and §B.8 does not list it. It lands in the comment beside the review.
      - name: The reviewed repository's bundle pin against this one's
        id: pin
        env:
          CALLER_CHECKOUT: ${{ steps.caller.outcome }}
        run: |
          set -euo pipefail
          problem=""
          # A checkout that failed and a repository that carries no `.agents/` tree look identical
          # from the file system, and they are opposite facts: the second means there is nothing to
          # compare, the first means the comparison did not happen. Reading them as one silently
          # skipped §B.6a and published green — in a workflow whose whole argument is that a skipped
          # check is a green one.
          if [ "$CALLER_CHECKOUT" != "success" ]; then
            problem="the reviewed repository's agent tree could not be checked out (${CALLER_CHECKOUT}), so its bundle pin was never compared with this repository's"
          elif [ -f caller/.agents/manifest.yaml ]; then
            if ! out=$(python .guardrails/scripts/caller_bundle_check.py \
                         --root .guardrails --caller caller/.agents/manifest.yaml 2>&1); then
              # `sed -n` exits 0 with no match; `grep` exits 1, and under `pipefail` that killed this
              # step before the line below could run — the fallback was unreachable code. The phrase
              # it matched was wrong as well: three of the four things this script reports (invalid
              # YAML, no pin, an unparseable version) never contain it.
              problem=$(printf '%s' "$out" | sed -n 's/^::error[^:]*:://p' | head -1)
              [ -n "$problem" ] || problem=$(printf '%s' "$out" | tail -1)
              [ -n "$problem" ] || problem="caller_bundle_check.py refused the caller's pin"
            fi
          fi
          { echo "problem<<EOF"; echo "$problem"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: The labels already on this pull request
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: printf '%s' "$LABELS" | jq -r '.[]' > current-labels.txt
      # The scope question, asked of the API rather than of the producing job: that job is skipped on
      # exactly the events where a human review matters, so its path filter cannot answer it. A
      # failure here fails the step and the gate with it, which is the right way round — answering
      # `false` because a query broke would hand the override to pull requests it does not cover.
      - name: Does this pull request change the workflow this run entered through?
        id: workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          # THE ENTRY workflow and what it calls locally, not any workflow. `GITHUB_WORKFLOW_REF`
          # names the file whose `on:` started this run — `owner/repo/.github/workflows/guardrails.yml@refs/pull/N/merge`
          # — and the runner action refuses to start when that file, or a workflow of the same
          # repository it calls through `uses: ./.github/workflows/…`, differs from the default
          # branch's copy. A workflow called from another repository, or one the entry does not
          # call, is outside that check, and a pull request changing one is reviewed normally.
          #
          # It matters in the direction of the override. `workflow_touching` is what lets
          # `human-reviewed` green a required check without a review, so a test that is too broad
          # hands that power to pull requests a review could have judged — the fail-open this
          # narrowing closes.
          # The derivation lives in `scripts/entry_workflow.sh`, driven by
          # `scripts/entry_workflow_suite.py`. It was inline until a review pointed out that
          # the suite this file cites drives the PYTHON planner with `--workflow-touching`
          # already computed, and touches this logic nowhere — a check cited as proof of
          # something it does not reach. A step that fetches the list and decides in one
          # breath cannot be driven by a fixture; this half takes the list on stdin.
          touching=$(printf '%s\n' "$files" \
            | .guardrails/scripts/entry_workflow.sh "$GITHUB_WORKFLOW_REF" "$REPO")
          echo "::notice::publish_verdict: entry workflow changed by this pull request: $touching"
          echo "touching=$touching" >> "$GITHUB_OUTPUT"
      - name: Plan the publication
        env:
          OUTCOME: ${{ needs.handover.outputs.produce-outcome }}
          RELEVANT: ${{ needs.handover.outputs.produce-relevant }}
          RUNNER: ${{ needs.handover.outputs.runner }}
          ROUTINE: ${{ needs.handover.outputs.routine }}
          LABELS_MAP: ${{ needs.handover.outputs.labels-map }}
          MANDATORY: ${{ needs.handover.outputs.mandatory-gates }}
          SKIP_REASON: ${{ needs.handover.outputs.skip-reason }}
          VERDICT_AUTHORS: ${{ needs.handover.outputs.verdict-authors }}
          L1_RESULTS: ${{ needs.handover.outputs.l1-results }}
          SKIP_KIND: ${{ needs.handover.outputs.skip-kind }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECT_AGENT: ${{ needs.handover.outputs.expect-agent }}
          BOT_LOGIN: ${{ needs.handover.outputs.bot-login }}
          REVIEW_LABEL: ${{ needs.handover.outputs.review-label }}
          OVERRIDE_LABEL: ${{ needs.handover.outputs.override-label }}
          # Read from THIS event, here rather than through an input. This job runs inside the same
          # workflow run as the trigger, so the event context is its own — and taking it from a
          # `with:` key would have made the whole feature wait for a second pull request, because a
          # caller pinned to `@main` may only pass inputs that already exist there.
          #
          # `github.event.sender` is the payload's own record of WHO APPLIED THE LABEL.
          # `github.actor` was asked before and is a different question — who started the run — and
          # the two part company on a re-run, where the payload still names the labeller and
          # `github.actor` names whoever pressed the button.
          #
          # The login and the TYPE both travel; neither decides here. Deciding here is what this
          # changes: `!endsWith(github.actor, '[bot]')` was a rule in a workflow expression, where
          # nothing can test it, and dropping the override was all it did — the label stayed on the
          # pull request claiming a human review that had not happened. The planner refuses it,
          # takes the label off and writes down that it did.
          OVERRIDE_BY: >-
            ${{ (github.event.action == 'labeled'
                 && github.event.label.name == needs.handover.outputs.override-label)
                && github.event.sender.login || '' }}
          OVERRIDE_BY_TYPE: ${{ github.event.sender.type }}
          WORKFLOW_TOUCHING: ${{ steps.workflows.outputs.touching }}
          PIN_PROBLEM: ${{ steps.pin.outputs.problem }}
          ROUTINE_SHA: ${{ steps.contract.outputs.sha }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "$SKIP_REASON" ]; then extra=(--skip-reason "$SKIP_REASON"); fi
          # The runner's execution log, when the action exposed one. Its name is the action's, not
          # ours. ADR-087 Engineering Protocol 4 asks whether the action exposes it at all — the
          # footer answers that on a real run rather than by prediction.
          # `find` on a missing directory exits non-zero, and under `pipefail` that killed this step
          # before the planner ran — on exactly the path where the artefact is absent, which is the
          # path §B.10's fallback exists for.
          if [ -d execution ]; then
            log=$(find execution -maxdepth 2 -type f | head -1 || true)
            if [ -n "$log" ]; then extra+=(--execution-log "$log"); fi
          fi
          if [ -n "$PIN_PROBLEM" ]; then extra+=(--pin-problem "$PIN_PROBLEM"); fi
          python .guardrails/scripts/publish_verdict.py plan \
            --schema .guardrails/.agents/schemas/verdict.schema.json \
            --labels-map "$LABELS_MAP" \
            --out plan.json \
            --verdict produced/verdict.json \
            --comments comments.json \
            --reviews reviews.json \
            --produce-outcome "$OUTCOME" \
            --produce-relevant "$RELEVANT" \
            ${extra[@]+"${extra[@]}"} \
            --mandatory "$MANDATORY" \
            --runner "$RUNNER" \
            --routine "$ROUTINE" \
            --routine-sha "$ROUTINE_SHA" \
            --verdict-authors "$VERDICT_AUTHORS" \
            --l1-results "$L1_RESULTS" \
            --skip-kind "$SKIP_KIND" \
            --head-sha "$HEAD_SHA" \
            --expect-agent "$EXPECT_AGENT" \
            --bot-login "$BOT_LOGIN" \
            --review-label "$REVIEW_LABEL" \
            --override-label "$OVERRIDE_LABEL" \
            --override-by "$OVERRIDE_BY" \
            --override-by-type "$OVERRIDE_BY_TYPE" \
            --workflow-touching "$WORKFLOW_TOUCHING" \
            --current-labels-file current-labels.txt
      # Read from the plan rather than recomputed, because the plan is the one place these are
      # decided. A job that could not reach the planner exports nothing, and a consumer reading an
      # empty value knows it did not get the answer — which is distinguishable from an answer.
      - name: What the plan decided, for a job that runs after this one
        id: outcome
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ -f plan.json ]; then
            {
              echo "verdict-source=$(jq -r '.verdict_source // ""' plan.json)"
              echo "conclusion=$(jq -r '.conclusion // ""' plan.json)"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::notice::publish_verdict: no plan was written, so nothing about this review is exported"
          fi
      # The only step that writes, and it writes as `exeris-bot` — the organisation's byline, never
      # a claim that the bot reviewed anything (§A.3).
      - name: Publish the review and apply the labels
        if: ${{ steps.identity.outputs.have == 'true' }}
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BOT_LOGIN: ${{ needs.handover.outputs.bot-login }}
          REVIEW_LABEL: ${{ needs.handover.outputs.review-label }}
        run: |
          set -euo pipefail
          # `jq -r` on an empty string writes a newline, so `[ -s ]` is true for nothing at all —
          # which posted a blank comment, markerless, once per push, on every path without a verdict.
          # Ask the plan, not the file.
          if [ "$(jq -r '.comment | length' plan.json)" -gt 0 ]; then
            jq -r '.comment' plan.json > comment.md
            # One comment per ROUTINE, edited in place. Keyed by role because §B.11 has two routines
            # on one pull request, and a single marker would have each overwrite the other's review.
            # The plan says what to match. A real verdict replaces whatever this role last
            # published; a no-verdict notice replaces only another notice, so a failed run cannot
            # erase findings. Only this bot's own issue comments are candidates: a marker quoted
            # inside a review would otherwise hand a review id to the issue-comment endpoint.
            # `marker_searches` is the search and the same search under the role's earlier names, so a
            # comment published before a rename is edited rather than left beside a new one.
            search=$(jq -r '.marker_search // ""' plan.json)
            existing=$(jq -r --argjson ms "$(jq -c '.marker_searches // [.marker_search // ""]' plan.json)" \
              --arg bot "$BOT_LOGIN" \
              'map(select(.source == "issue-comment" and .author == $bot and .body != null
                          and (.body as $b | any($ms[]; . as $m | $b | startswith($m)))))
               | last | .id // empty' comments.json)
            # What the search was, what it had to choose from, and what it chose. Written because a
            # publication that creates a second comment where it should have updated the first has
            # two possible causes, and a log naming neither cannot tell them apart: the candidate
            # missing from `comments.json`, or its body not starting with the marker. Both are
            # visible here, and the first 72 characters of each candidate are enough to compare a
            # prefix by eye.
            bots=$(jq --arg bot "$BOT_LOGIN" \
              '[.[] | select(.source == "issue-comment" and .author == $bot)] | length' comments.json)
            echo "::notice::publish_verdict: marker_search=[$search]"
            echo "::notice::publish_verdict: $bots comment(s) by $BOT_LOGIN here; matched=${existing:-NONE}"
            jq -r --arg bot "$BOT_LOGIN" \
              '.[] | select(.source == "issue-comment" and .author == $bot and .body != null)
               | "publish_verdict: candidate \(.id): \(.body[0:72])"' comments.json || true
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md --silent
            else
              gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md --silent
            fi
          fi
          # `while read` rather than `for … in $(…)`: a label is allowed to contain a space, and the
          # word split would apply half of one and then fail on the other half.
          jq -r '.labels_add[]' plan.json | while IFS= read -r label; do
            [ -n "$label" ] && gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=$label" --silent
          done
          # The request label is a state, not a verdict: it means "asked for, not yet done", so it
          # comes off as soon as a review has run — whatever the review concluded. It is removed here
          # rather than through the label map because the map describes what a verdict means, and this
          # says nothing about the code.
          if [ "$(jq -r '.verdict_source' plan.json)" != "none" ]; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/$REVIEW_LABEL" --silent 2>/dev/null || true
          fi
          jq -r '.labels_remove[]' plan.json | while IFS= read -r label; do
            [ -n "$label" ] && gh api -X DELETE \
              "repos/$REPO/issues/$PR/labels/$(jq -rn --arg l "$label" '$l|@uri')" --silent
          done
      - name: The required check
        if: ${{ !cancelled() }}
        run: python .guardrails/scripts/publish_verdict.py gate --plan plan.json

  # ONE ROW PER L2 RUN, WRITTEN WHERE THE RUN HAPPENED — ADR-087 §C.13-§C.17.
  #
  # The row contract has two producers. The other one reconstructs a run's components afterwards
  # from what the host still holds, and says so in every row's `instrument.fence`. This one is
  # handed them: the producing job hashed the prompt, the routine, the agent file and the allow-list
  # while it still had them, and carried out the digests. Nothing here renders a prompt or reads a
  # workflow file, and the two producers' rows are compared component by component — a disagreement
  # is what retires the other one's fences, and a producer that reconstructed as well would have
  # nothing to compare.
  #
  # IT DECIDES NOTHING ABOUT THE PULL REQUEST. The required check is the job above; this one writes
  # a record. A capture that failed a pull request over what a dataset holds would make the dataset
  # a gate, which is the one thing ADR-086 §A.2 says it must never become.
  #
  # SO ITS COLOUR MEANS ONE THING: green where there was nothing to write — no execution log, no
  # identity to write under, a component the exports did not carry, a repository whose inbox does
  # not exist — and red only where there WAS something to write and the write did not happen. A row
  # the inbox's own rules refuse is neither: it is reported, as an artefact and as one issue in the
  # source repository, which is where a producer defect is fixed (§C.15).
  capture:
    needs: [handover, verdict]
    # `!cancelled()` rather than `success()`: a review that ended BLOCKED is still a review that
    # happened, and a row records what a run did rather than what it concluded. A cancelled run has
    # nothing to record.
    if: ${{ !cancelled() && needs.handover.outputs.capture == 'true' }}
    runs-on: ubuntu-latest
    # ONE LEG PER PART, ONE AT A TIME. Each part's run is its own row, its own stream and its own
    # artefact, so a leg is exactly the one-run capture below. `max-parallel: 1` keeps this run's legs
    # from racing each other on the inbox's `main`; the writes survive a race anyway, the way they
    # do across repositories. The leg named `""` is the scalar exports' one run.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        part: ${{ fromJSON(needs.handover.outputs.capture-parts != '' && needs.handover.outputs.capture-parts || '[""]') }}
    # ONE CAPTURE AT A TIME PER REVIEWED REPOSITORY AND PART. Every row is committed to the inbox's
    # `main`, so two captures of one repository running together would race on it.
    # `cancel-in-progress: false` serialises them; it does not promise that every member survives —
    # a group holds one running member and one waiting one, and a third joining displaces the
    # waiting one. And it serialises one repository only, while every repository in the
    # organisation commits to the same branch. So the group is an optimisation and NOT the
    # guarantee: each write below is made safe on its own, by replaying it against what is actually
    # on the remote rather than by being alone.
    #
    # PER PART, because a group holds one running member and one waiting one: a third leg in the
    # same group displaces the second while it waits, which leaves that part uncaptured for no
    # reason about the part.
    concurrency:
      group: inbox-${{ github.repository }}-${{ matrix.part }}
      cancel-in-progress: false
    # READ, AND NOTHING THIS JOB'S CALLER DOES NOT ALREADY GRANT THE REVIEW. Two reads are made with
    # this token — the reviewed repository, to decide which inbox a row belongs to, and the pull
    # request, for its scope class and its author — and nothing else. Every write below — the
    # stream, the row, the issue a refusal files — goes through an App
    # installation token minted for the step that makes it. A caller's permission block therefore
    # does not grow when capture is turned on, which is what `caller_permissions_check.py` reads it
    # for.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The assembly comes from the organisation's default branch, never from the reviewed tree: it
      # decides what a row about this pull request says, and read from the branch a pull request
      # could write its own measurement.
      - name: Fetch the contract (exeris-systems/.github@main)
        uses: actions/checkout@v7
        with: { repository: exeris-systems/.github, ref: main, path: .guardrails }
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      # The row is checked against the record schema here, before it is committed anywhere, which
      # is the half of the inbox's gate that needs a Draft 2020-12 validator.
      - run: pip install --quiet jsonschema
      # Guarded on the name, not on the file: a produce job that was skipped uploads nothing, and an
      # empty name handed to the download is a step that fails about the wrong thing.
      # WHICH RUN THIS LEG CAPTURES, and every value the steps below read about it. A part's leg
      # reads what its produce leg uploaded; the scalar leg reads the inputs. Written to the job's
      # environment once, so no later step can mix one run's artefact with another's digests.
      - name: The surface of this leg's run, as its produce leg left it
        if: ${{ matrix.part != '' }}
        uses: actions/download-artifact@v8
        with:
          name: l2-surface-${{ github.event.pull_request.number }}-${{ matrix.part }}
          path: surface
        continue-on-error: true
      - name: Which run this leg captures
        id: run
        env:
          PART: ${{ matrix.part }}
          PR: ${{ github.event.pull_request.number }}
          IN_ARTIFACT: ${{ needs.handover.outputs.execution-artifact }}
          IN_ARTIFACT_ID: ${{ needs.handover.outputs.capture-artifact-id }}
          IN_VERDICT_SOURCE: ${{ needs.verdict.outputs.verdict-source }}
          IN_PROMPT_SHA256: ${{ needs.handover.outputs.capture-prompt-sha256 }}
          IN_ROUTINE_SHA256: ${{ needs.handover.outputs.capture-routine-sha256 }}
          IN_ROUTINE_SHA: ${{ needs.handover.outputs.capture-routine-sha }}
          IN_AGENTS_MD_SHA256: ${{ needs.handover.outputs.capture-agents-md-sha256 }}
          IN_SYSTEM_PROMPT_SHA256: ${{ needs.handover.outputs.capture-system-prompt-sha256 }}
          IN_TOOL_SURFACE: ${{ needs.handover.outputs.capture-tool-surface }}
          IN_BUNDLE_VERSION: ${{ needs.handover.outputs.capture-bundle-version }}
          IN_CHECKOUT_SHA: ${{ needs.handover.outputs.capture-checkout-sha }}
          IN_HEAD_SHA: ${{ needs.handover.outputs.capture-head-sha }}
          IN_REVIEW_STARTED_AT: ${{ needs.handover.outputs.capture-review-started-at }}
        run: |
          set -euo pipefail
          if [ -z "$PART" ]; then
            {
              echo "ARTIFACT=$IN_ARTIFACT"
              echo "ARTIFACT_ID=$IN_ARTIFACT_ID"
              echo "VERDICT_SOURCE=$IN_VERDICT_SOURCE"
              echo "PROMPT_SHA256=$IN_PROMPT_SHA256"
              echo "ROUTINE_SHA256=$IN_ROUTINE_SHA256"
              echo "ROUTINE_SHA=$IN_ROUTINE_SHA"
              echo "AGENTS_MD_SHA256=$IN_AGENTS_MD_SHA256"
              echo "SYSTEM_PROMPT_SHA256=$IN_SYSTEM_PROMPT_SHA256"
              echo "TOOL_SURFACE=$IN_TOOL_SURFACE"
              echo "BUNDLE_VERSION=$IN_BUNDLE_VERSION"
              echo "CHECKOUT_SHA=$IN_CHECKOUT_SHA"
              echo "CAPTURE_HEAD_SHA=$IN_HEAD_SHA"
              echo "REVIEW_STARTED_AT=$IN_REVIEW_STARTED_AT"
            } >> "$GITHUB_ENV"
            echo "artifact=$IN_ARTIFACT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          doc=surface/surface.json
          if [ ! -f "$doc" ]; then
            echo "::notice::capture: the $PART leg left no surface, so it exposed no execution log and there is no row for it"
            echo "artifact=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A part's verdict reached the published one through the aggregate, which read it out of
          # this run's execution log — so that is the route this run's verdict took, whatever route
          # the composed verdict took to the publication.
          {
            echo "ARTIFACT=$(jq -r '.artifact // ""' "$doc")"
            echo "ARTIFACT_ID=$(jq -r '."artifact-id" // ""' "$doc")"
            echo "VERDICT_SOURCE=execution log"
            for key in prompt-sha256 routine-sha256 routine-sha agents-md-sha256 system-prompt-sha256 \
                       tool-surface bundle-version checkout-sha review-started-at; do
              name=$(tr 'a-z-' 'A-Z_' <<<"$key")
              echo "$name=$(jq -r --arg k "$key" '.[$k] // ""' "$doc")"
            done
            echo "CAPTURE_HEAD_SHA=$(jq -r '."head-sha" // ""' "$doc")"
          } >> "$GITHUB_ENV"
          echo "artifact=$(jq -r '.artifact // ""' "$doc")" >> "$GITHUB_OUTPUT"
      - name: The runner's execution log, if the produce job uploaded one
        if: ${{ steps.run.outputs.artifact != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.run.outputs.artifact }}
          path: execution-log
        continue-on-error: true
      - name: Is there a run to capture?
        id: stream
        run: |
          set -euo pipefail
          # `find` on a missing directory exits non-zero, which under `pipefail` would end this step
          # on exactly the path the notice below exists for.
          log=""
          if [ -d execution-log ]; then
            log=$(find execution-log -maxdepth 2 -type f | head -1 || true)
          fi
          if [ -z "$log" ]; then
            echo "::notice::capture: this run exposed no execution log, so there is no stream and no row. The review is unaffected — the required check is the publish job's."
          fi
          echo "log=$log" >> "$GITHUB_OUTPUT"
      - name: Is there an identity to write with?
        id: identity
        env:
          APP_ID: ${{ secrets.exeris_inbox_app_id }}
          # The voice's, asked here because the `secrets` context is not readable from a step's
          # `if:` — the publishing half asks its own question in a step for the same reason.
          VOICE_APP_ID: ${{ secrets.exeris_bot_app_id }}
          EXECUTION_REPOSITORY: ${{ needs.handover.outputs.execution-repository }}
          STREAMS_REPOSITORY: ${{ needs.handover.outputs.streams-repository }}
        run: |
          set -euo pipefail
          if [ -n "$VOICE_APP_ID" ]; then echo "voice=true" >> "$GITHUB_OUTPUT";
          else echo "voice=false" >> "$GITHUB_OUTPUT"; fi
          if [ -z "$APP_ID" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::capture: no exeris_inbox_app_id was passed, so no stream and no row are written. Pass exeris_inbox_app_id and exeris_inbox_private_key from the caller to turn capture on; a capture with no identity of its own writes nothing rather than writing under another."
            exit 0
          fi
          echo "have=true" >> "$GITHUB_OUTPUT"
          # The token is minted for BOTH data repositories, because one identity writes the stream
          # and the row and the reference between them has to resolve: a row whose stream was
          # committed by somebody else is a reference nobody can verify. The App names them as bare
          # repository names beside its owner, which is the shape the minting action takes.
          {
            echo "repositories<<EOF"
            echo "${EXECUTION_REPOSITORY##*/}"
            echo "${STREAMS_REPOSITORY##*/}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Mint the exeris-inbox token
        id: inbox
        if: ${{ steps.identity.outputs.have == 'true' && steps.stream.outputs.log != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.exeris_inbox_app_id }}
          private-key: ${{ secrets.exeris_inbox_private_key }}
          owner: exeris-systems
          repositories: ${{ steps.identity.outputs.repositories }}
          # The one scope this job spends and nothing else: a stream and a row are both commits
          # pushed to a default branch, and nothing here opens a pull request. Named so that
          # widening the App later does not silently widen a job that runs beside a model's own
          # output.
          permission-contents: write
      # `fetch-depth: 0`, because this checkout is pushed from: the inbox's `main` is fetched onto
      # it and a commit is pushed back, and a shallow history is refused by the receiving end. The
      # repository holds records and tooling, so the whole history is small.
      - name: The row contract and its derivations
        if: ${{ steps.inbox.outputs.token != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.handover.outputs.execution-repository }}
          ref: main
          path: execution
          fetch-depth: 0
          token: ${{ steps.inbox.outputs.token }}
      # PHASE ONE: what the row would be, before anything is written. Every reason a row is not
      # written is decided here, so a run that will never yield one commits no stream — and the
      # stream's own digest and event count come out of the same reading the row will carry.
      - name: What this run would become
        id: decide
        if: ${{ steps.inbox.outputs.token != '' }}
        env:
          # The job's own token, which holds the two read scopes above and nothing more. It makes
          # exactly two calls — the repository and the pull request — both covered by what a caller
          # already grants the review, so turning capture on adds nothing to a caller's block.
          # Every write below uses an App token instead.
          GH_TOKEN: ${{ github.token }}
          LOG: ${{ steps.stream.outputs.log }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STREAMS_REPOSITORY: ${{ needs.handover.outputs.streams-repository }}
        run: |
          set -euo pipefail
          python .guardrails/scripts/capture_ci_row.py \
            --execution-root execution \
            --log "$LOG" \
            --repository "$REPO" \
            --pull-request "$PR" \
            --event-head-sha "$HEAD_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --execution-artifact "$ARTIFACT" \
            --artifact-id "$ARTIFACT_ID" \
            --verdict-source "$VERDICT_SOURCE" \
            --streams-repository "$STREAMS_REPOSITORY" \
            --prompt-sha256 "$PROMPT_SHA256" \
            --routine-sha256 "$ROUTINE_SHA256" \
            --routine-sha "$ROUTINE_SHA" \
            --agents-md-sha256 "$AGENTS_MD_SHA256" \
            --system-prompt-sha256 "$SYSTEM_PROMPT_SHA256" \
            --tool-surface "$TOOL_SURFACE" \
            --bundle-version "$BUNDLE_VERSION" \
            --checkout-sha "$CHECKOUT_SHA" \
            --head-sha "$CAPTURE_HEAD_SHA" \
            --review-started-at "$REVIEW_STARTED_AT" \
            --out capture-decision.json
          {
            echo "reason=$(jq -r '.reason // ""' capture-decision.json)"
            echo "run-id=$(jq -r '.run_id // ""' capture-decision.json)"
            echo "date=$(jq -r '.date // ""' capture-decision.json)"
            echo "branch=$(jq -r '.branch // ""' capture-decision.json)"
            echo "stream-path=$(jq -r '.stream.path // ""' capture-decision.json)"
          } >> "$GITHUB_OUTPUT"
          reason=$(jq -r '.reason // ""' capture-decision.json)
          if [ -n "$reason" ]; then
            echo "::notice::capture: no row — $reason: $(jq -r '.detail' capture-decision.json)"
          fi
      # A STREAM IS CONTENT, and it goes to `main` directly and BEFORE the row (§C.13): every row's
      # `execution.event_stream.ref` names the commit holding its stream, and the row's digest is
      # verifiable only against a commit that exists.
      - name: Commit the stream to the streams repository
        id: stream-commit
        if: ${{ steps.decide.outputs.reason == '' && steps.decide.outputs.stream-path != '' }}
        env:
          GH_TOKEN: ${{ steps.inbox.outputs.token }}
          STREAMS_REPOSITORY: ${{ needs.handover.outputs.streams-repository }}
          LOG: ${{ steps.stream.outputs.log }}
        run: |
          set -euo pipefail
          # The App's own numeric id, which is the address the host attributes a commit by this
          # identity to. Asked of the host rather than written down: an id is the host's to assign,
          # and a hard-coded one attributes the commit to nobody the moment it is wrong.
          uid=$(gh api /users/exeris-inbox%5Bbot%5D --jq .id)
          # Initialised, not cloned: every read of the remote happens inside the attempts below, so
          # a transfer the host drops part-way is an attempt spent rather than the step failed.
          git init --quiet streams
          git -C streams remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${STREAMS_REPOSITORY}.git"
          # WRITTEN TO A FILE BECAUSE IT IS REPLAYED. Two captures append to one `index.json`, which
          # is one insertion each at one place in one array — a conflict every time, not a rare one,
          # since the concurrency group is per reviewed repository and two repositories capturing at
          # once is the ordinary case. So a rejected push is answered by discarding this clone's
          # commit, taking what is actually on the remote, and deriving the append again from it.
          cat > append-stream.py <<'PY'
          import json, os, shutil, sys
          log, decision_path, clone = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(decision_path, encoding="utf-8") as fh:
              entry = json.load(fh)["stream"]
          target = os.path.join(clone, entry["path"])
          os.makedirs(os.path.dirname(target), exist_ok=True)
          # A stream already there is the same run captured twice, and content is not rewritten:
          # identical bytes are a no-op, and different bytes under one name are refused rather than
          # overwritten, because the first copy is the evidence the row's digest was taken over.
          if os.path.exists(target):
              with open(target, "rb") as fh, open(log, "rb") as held:
                  if fh.read() != held.read():
                      raise SystemExit(f"::error::capture: {entry['path']} already holds other "
                                       f"bytes; a stream is content and is never rewritten")
          else:
              shutil.copyfile(log, target)
          index_path = os.path.join(clone, "index.json")
          with open(index_path, encoding="utf-8") as fh:
              index = json.load(fh)
          if not any(e.get("path") == entry["path"] for e in index):
              index.append(entry)
          with open(index_path, "w", encoding="utf-8") as fh:
              json.dump(index, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          PY
          message="chore(streams): the execution log of $(jq -r .run_id capture-decision.json)"
          pushed=no
          last=""
          for attempt in 1 2 3 4 5; do
            # A pause before every attempt but the first, randomised so that captures which lost
            # the same race do not meet again at the same instant.
            if [ "$attempt" -gt 1 ]; then sleep $(( (RANDOM % 5) + 2 * attempt )); fi
            # The append is re-derived from the index as it is on the remote at this moment, so a
            # capture that lost the race loses its commit and not its entry: nothing it wrote is
            # carried forward, and everything it wanted written is derived again. A fetch that did
            # not answer is an attempt spent: `main` always exists, so a failed fetch says only that
            # this attempt saw nothing.
            git -C streams fetch --quiet origin main || { last="fetch"; continue; }
            git -C streams reset --quiet --hard origin/main
            python append-stream.py "$LOG" capture-decision.json streams
            git -C streams add -A
            # Nothing to add is the same run captured twice: the stream and its entry are already
            # on `main`, and the commit a row will reference is the one holding them.
            if [ -z "$(git -C streams status --porcelain)" ]; then pushed=yes; break; fi
            git -C streams -c user.name="exeris-inbox[bot]" \
                -c "user.email=${uid}+exeris-inbox[bot]@users.noreply.github.com" \
                commit -qm "$message"
            if git -C streams push --quiet origin HEAD:main; then pushed=yes; break; fi
            last="push"
          done
          # RED, and deliberately. A stream that was not pushed is a commit no row can reference,
          # and this job reports green whenever it has nothing to write — so a green here would
          # be indistinguishable from a run that had nothing to capture.
          if [ "$pushed" != "yes" ]; then
            echo "::error::capture: the stream could not be pushed after five attempts, the last ending at the ${last:-assembly} step, so no row is written — a row references its stream at a commit, and the commit has to exist"
            exit 1
          fi
          echo "commit=$(git -C streams rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "email=${uid}+exeris-inbox[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
      # PHASE TWO: the row, now that the commit its reference names exists. The same script, the
      # same decisions, one more fact.
      - name: Assemble the row and put it through the inbox's own rules
        id: assemble
        if: ${{ steps.stream-commit.outputs.commit != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LOG: ${{ steps.stream.outputs.log }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STREAMS_REPOSITORY: ${{ needs.handover.outputs.streams-repository }}
          STREAM_COMMIT: ${{ steps.stream-commit.outputs.commit }}
          BRANCH: ${{ steps.decide.outputs.branch }}
          EMAIL: ${{ steps.stream-commit.outputs.email }}
        run: |
          set -euo pipefail
          assemble() {
            python .guardrails/scripts/capture_ci_row.py \
              --execution-root execution \
              --log "$LOG" \
              --repository "$REPO" \
              --pull-request "$PR" \
              --event-head-sha "$HEAD_SHA" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --execution-artifact "$ARTIFACT" \
              --artifact-id "$ARTIFACT_ID" \
              --verdict-source "$VERDICT_SOURCE" \
              --streams-repository "$STREAMS_REPOSITORY" \
              --stream-commit "$STREAM_COMMIT" \
              --inbox-root execution \
              --prompt-sha256 "$PROMPT_SHA256" \
              --routine-sha256 "$ROUTINE_SHA256" \
              --routine-sha "$ROUTINE_SHA" \
              --agents-md-sha256 "$AGENTS_MD_SHA256" \
              --system-prompt-sha256 "$SYSTEM_PROMPT_SHA256" \
              --tool-surface "$TOOL_SURFACE" \
              --bundle-version "$BUNDLE_VERSION" \
              --checkout-sha "$CHECKOUT_SHA" \
              --head-sha "$CAPTURE_HEAD_SHA" \
              --review-started-at "$REVIEW_STARTED_AT" \
              --row row.json \
              --commit-message capture-commit-message.txt \
              --issue-body capture-issue-body.md \
              --out capture-decision.json
          }
          # THE ROW IS COMMITTED TO THE INBOX'S `main`, ONE COMMIT PER ROW. The inbox App holds a
          # ruleset bypass on that repository alone, so the row lands without a pull request: the
          # producer has already put it through the inbox's own validator, and the inbox validates
          # it again on the push (ADR-087 §C.15). The branch is the one the script decided, read
          # from its decision rather than spelled here twice.
          #
          # DERIVED AGAINST THE BRANCH AS IT IS, EVERY ATTEMPT. `main` is shared by every
          # repository in the organisation, so a push that loses the race is the ordinary case and
          # is answered by fetching the branch, discarding this attempt and assembling again onto
          # it — so that `write_row`'s two answers, identical bytes are a skip and different bytes
          # under one name are refused, are decided against what the branch actually holds rather
          # than against what it held when this job started. Five attempts, because the race is
          # organisation-wide and each attempt is a fetch and a rebuild of one file.
          pushed=no
          last=""
          for attempt in 1 2 3 4 5; do
            # A pause before every attempt but the first, randomised so that runs which lost
            # the same race do not meet again at the same instant: every repository of the
            # organisation writes here.
            if [ "$attempt" -gt 1 ]; then sleep $(( (RANDOM % 5) + 2 * attempt )); fi
            # A fetch that did not answer is an attempt spent, not the step failed: the branch
            # always exists, so the only thing a failed fetch says is that this attempt saw nothing.
            git -C execution fetch --quiet origin "$BRANCH" || { last="fetch"; continue; }
            git -C execution checkout --quiet -B "$BRANCH" "origin/$BRANCH"
            git -C execution reset --quiet --hard HEAD
            git -C execution clean --quiet -fd
            assemble
            # Anything but a new row has nothing of this run's to push: a refusal is reported as an
            # artefact and an issue, and a skip is this run captured twice.
            if [ "$(jq -r '.state // ""' capture-decision.json)" != "new" ]; then pushed=yes; break; fi
            git -C execution add -A
            if [ -z "$(git -C execution status --porcelain)" ]; then pushed=yes; break; fi
            git -C execution -c user.name="exeris-inbox[bot]" -c "user.email=$EMAIL" \
                commit -q -F "$GITHUB_WORKSPACE/capture-commit-message.txt"
            if git -C execution push --quiet origin "HEAD:refs/heads/$BRANCH"; then
              pushed=yes; break
            fi
            last="push"
          done
          # RED, for the reason the stream's push is red: the stream is committed by now, so a row
          # that did not reach the branch is something this job had to write and did not.
          if [ "$pushed" != "yes" ]; then
            echo "::error::capture: the row could not be pushed to the inbox's $BRANCH after five attempts, the last ending at the ${last:-assembly} step, so the run's row is not in the inbox"
            exit 1
          fi
          {
            echo "state=$(jq -r '.state // ""' capture-decision.json)"
            echo "reason=$(jq -r '.reason // ""' capture-decision.json)"
          } >> "$GITHUB_OUTPUT"
      # A REFUSED ROW IS KEPT AND REPORTED, NEVER REPAIRED HERE (§C.15). The artefact is the row as
      # it was assembled, so the defect can be read rather than guessed at from a message.
      - name: Keep the refused row where it can be read
        if: ${{ steps.assemble.outputs.state == 'refused' }}
        uses: actions/upload-artifact@v7
        with:
          name: l2-row-${{ github.event.pull_request.number }}${{ matrix.part != '' && format('-{0}', matrix.part) || '' }}-invalid
          path: row.json
          if-no-files-found: ignore
          retention-days: 90
      # The voice, not the pen: an issue is speech, and the App that writes rows holds no
      # `issues` scope at all (§A.1). Minted again here, with the one scope this step spends.
      - name: Mint the exeris-bot token
        id: voice
        if: ${{ steps.assemble.outputs.state == 'refused' && steps.identity.outputs.voice == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.exeris_bot_app_id }}
          private-key: ${{ secrets.exeris_bot_private_key }}
          permission-issues: write
      - name: File one issue in the source repository, keyed so a re-run files none
        if: ${{ steps.voice.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.voice.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          key=$(jq -r .issue_key capture-decision.json)
          # The open issues, read and filtered here rather than through the search index: search is
          # eventually consistent, and an idempotence test that has not indexed yet files a second
          # issue every run. `pull_request == null` because the issues endpoint lists both.
          open=$(gh api "repos/$REPO/issues?state=open&per_page=100" --paginate \
                 | jq -s 'add // []' \
                 | jq --arg k "$key" '[.[] | select(.pull_request == null)
                                          | select((.body // "") | contains($k))] | length')
          if [ "$open" -gt 0 ]; then
            echo "::notice::capture: an open issue already carries the key $key, so none was filed"
            exit 0
          fi
          gh api -X POST "repos/$REPO/issues" \
            -f "title=capture: the run record of pull request #${PR} was refused by the inbox's rules" \
            -F body=@capture-issue-body.md \
            -f "labels[]=triage" --silent
      - name: What this capture did
        if: ${{ !cancelled() }}
        env:
          CONCLUSION: ${{ needs.verdict.outputs.conclusion }}
        run: |
          set -euo pipefail
          # The verdict's own conclusion, recorded beside the row and selected on nowhere: a capture
          # that wrote rows only for green reviews would be a dataset of the runs that went well.
          echo "- the publication concluded **${CONCLUSION:-(nothing)}**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f capture-decision.json ]; then
            jq -r '"- row: **" + (.state // "none") + "**"
                   + (if .reason then " — `" + .reason + "`" else "" end)' \
               capture-decision.json >> "$GITHUB_STEP_SUMMARY"
          fi
