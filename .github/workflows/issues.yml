# This repository's own issue-side caller — the file `caller-example/issues.yml` hands to every other
# repository, pointed at the workflows beside it.
#
# It was missing, and the consequence was concrete rather than tidy: `.github` defines `labels.yml`
# and carried almost none of it. `hard-block`, `cross-repo`, `tck-debt`, `phase-gated` and
# `needs-review` did not exist here, so nobody could apply the label the readiness trigger waits
# for — and the labels the publication does apply were created implicitly by the issues API in
# whatever colour it chose, the taxonomy bypassed in the repository that owns it.
#
# Separate from guardrails.yml because it is not pull-request-triggered and needs `issues: write`,
# which the pull-request gates deliberately do not have.
name: issues
on:
  # The taxonomy syncs when it CHANGES, not only once a week. A label defined in `labels.yml` and
  # not yet created is a label nothing can apply — and the review that tells a reader to apply
  # `human-reviewed` was written before this trigger existed, so its advice was not actionable
  # for as long as nobody remembered to dispatch this file by hand. A definition that needs a human
  # to remember it is a definition that drifts.
  #
  # Also on this file itself, so a repository adopting the caller gets its first sync from the same
  # merge rather than from whoever notices. Other repositories read `labels.yml` from this one at
  # `@main`, which a push here cannot reach; for them the weekly run below is what carries a change.
  push:
    branches: [main]
    paths:
      - labels.yml
      - .github/workflows/issues.yml
  schedule:
    - cron: "17 4 * * 1"     # Monday, early. Label drift and stale evidence are not urgent.
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report label changes without making them"
        type: boolean
        default: false
permissions:
  issues: write

jobs:
  labels:
    uses: ./.github/workflows/labels-sync.yml
    with:
      dry-run: ${{ inputs.dry-run == true }}
  hygiene:
    # Not on a taxonomy push. This job closes issues that have gone quiet, and a label
    # definition changing is no reason to age one out — the weekly run is when that
    # judgement belongs.
    if: ${{ github.event_name != 'push' }}
    uses: ./.github/workflows/issue-hygiene.yml
