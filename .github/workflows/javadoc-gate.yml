# Reusable: Javadoc gate on Maven modules — ADR-085 §F.21, javadoc-conventions.md rules 1-11.
#
# Two gates, because the standard asks two different questions of two different sets of modules.
#
#   `modules`      whole-module. Every file has to comply, always. Rule 11's exception: the SPI, the
#                  TCK, the published API surfaces a downstream implementor reads.
#   `diff-modules` changed files only, which is what rule 11 says for Kernel Core, Community and
#                  tooling: "rules 2-9 apply to changed files only. No backfill mandate." A module
#                  carrying documentation debt is not this pull request's problem; a file this pull
#                  request touched is.
#
# Both run in one job so every worklist prints in one run, and so the check name a ruleset requires
# does not change when a repository moves a module from one list to the other.
name: javadoc-gate
on:
  workflow_call:
    inputs:
      modules:      { type: string, default: "", description: "Comma-separated Maven modules gated in full, e.g. 'exeris-kernel-spi,exeris-kernel-tck'" }
      diff-modules: { type: string, default: "", description: "Comma-separated Maven modules gated on the pull request's changed files only (javadoc-conventions.md rule 11)" }
      build-modules: { type: string, default: "", description: "Modules a gated module needs BUILT but that are not themselves gated — an annotation processor, a code generator. `-am` does not find these: <annotationProcessorPaths> is not a reactor edge." }
      java-version: { type: string, default: "25" }
      java-distribution: { type: string, default: "temurin" }
      source-root:  { type: string, default: "src/main/java", description: "Source root inside each gated module" }
      extra-maven-args: { type: string, default: "" }
permissions:
  contents: read
jobs:
  javadoc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff half needs the merge base to diff against, and a shallow clone does not have
          # it. The whole half never looks at history, so a repository that gates no module in diff
          # mode keeps the cheap checkout.
          fetch-depth: ${{ inputs.diff-modules != '' && 0 || 1 }}
      # The Checkstyle ruleset AND the engine that runs it are part of the bundle, like every other
      # config these gates read. The ruleset used to be named at a path inside one repository, which
      # meant the gate could only run where a copy had been made, and a copy is a thing that drifts.
      - uses: actions/checkout@v4
        with: { repository: exeris-systems/.github, path: .guardrails }
      - uses: actions/setup-java@v4
        with: { java-version: "${{ inputs.java-version }}", distribution: "${{ inputs.java-distribution }}", cache: maven }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Not every repository ships a wrapper — exeris-kernel builds with the runner's `mvn`. Pick
      # whichever exists rather than assuming, so adopting this gate is a pom change and nothing else.
      - name: Resolve the Maven command
        id: mvn
        run: |
          if [ -x ./mvnw ]; then echo "cmd=./mvnw" >> "$GITHUB_OUTPUT"; else echo "cmd=mvn" >> "$GITHUB_OUTPUT"; fi
      - name: Resolve the gated module set
        id: set
        run: |
          gated=$(printf '%s,%s' "${{ inputs.modules }}" "${{ inputs.diff-modules }}" | sed 's/,\+/,/g; s/^,//; s/,$//')
          [ -n "$gated" ] || { echo "::error::neither 'modules' nor 'diff-modules' was given — the gate has nothing to check"; exit 1; }
          # `build-modules` joins the reactor list and NOTHING else: it is built, never audited.
          build=$(printf '%s,%s' "$gated" "${{ inputs.build-modules }}" | sed 's/,\+/,/g; s/^,//; s/,$//')
          echo "gated=$gated" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      # The engine, from the bundle. maven-checkstyle-plugin 3.6.0 defaults to Checkstyle 9.3, which
      # predates {@snippet} and cannot parse the construct rule 8 requires — 77 parse errors on
      # exeris-sdk-annotations under 9.3, 0 under 13.8.0, every other finding identical. Resolving the
      # engine here means a repository adopting this gate does not have to discover a grammar version
      # to make the bundle's own rules parse. See java/checkstyle-engine-pom.xml.
      - name: Resolve the pinned Checkstyle engine
        id: cs
        run: |
          ${{ steps.mvn.outputs.cmd }} -q -B -ntp -f .guardrails/java/checkstyle-engine-pom.xml \
            dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/cs-cp.txt"
          java -cp "$(cat "$RUNNER_TEMP/cs-cp.txt")" com.puppycrawl.tools.checkstyle.Main --version
      # Install first, and skip Checkstyle while doing it. Two reasons, both learned the hard way on
      # exeris-kernel. A repository whose Checkstyle plugin takes a reactor module as a plugin
      # DEPENDENCY (for the ruleset) cannot resolve it from the reactor — plugin dependencies come
      # from repositories — so any goal that triggers the validate phase dies with "Could not find
      # artifact eu.exeris:exeris-kernel-build-config:jar:0.12.0 in central". And `javadoc:javadoc`
      # does trigger it, through generate-sources, on every module `-am` drags in. The diff half
      # needs this step for a second reason: it compiles the classes `javadoc -cp` reads.
      #
      # `extra-maven-args` reaches this step too. Without it a repository could not turn off a plugin
      # that runs during install but has nothing to do with the gate — exeris-sdk had to tie
      # `jacoco.skip` to `skipTests` in its own pom to get past this step.
      - name: Resolve the reactor into the local repository
        id: reactor
        run: ${{ steps.mvn.outputs.cmd }} -B -ntp -pl "${{ steps.set.outputs.build }}" -am -DskipTests -Dcheckstyle.skip=true install ${{ inputs.extra-maven-args }}

      # ---------------------------------------------------------------- Javadoc (doclint) half
      # These need the reactor: `javadoc` reads a resolved classpath and compiled classes.
      #
      # `!cancelled()` rather than `always()`: `always()` also runs after someone cancels the
      # workflow, holding a runner to produce a report nobody is waiting for. Gated on the install
      # step, because `!cancelled()` alone does not say WHICH earlier step failed, and with a failed
      # install these steps die on a missing artifact rather than on a Javadoc finding.
      - name: Javadoc (failOnWarnings) on fully gated modules
        if: ${{ !cancelled() && steps.reactor.outcome == 'success' && inputs.modules != '' }}
        run: ${{ steps.mvn.outputs.cmd }} -B -ntp -pl "${{ inputs.modules }}" -DskipTests -Dcheckstyle.skip=true javadoc:javadoc ${{ inputs.extra-maven-args }}

      - name: Changed Java files in diff-gated modules
        id: targets
        # Git and Python only — no reactor, so this reports even when the build is broken.
        if: ${{ !cancelled() && inputs.diff-modules != '' }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          # "Changed files" only means something against a base. A caller that also runs this on
          # `push` has no pull request to diff, and the honest answer there is to say so rather than
          # to invent a range or to report a green gate that checked nothing.
          if [ -z "$base" ]; then
            echo "::notice::no pull-request context — the changed-files half of the gate needs a base commit and is skipped"
            echo "any=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python .guardrails/scripts/javadoc_diff_targets.py \
            --modules "${{ inputs.diff-modules }}" \
            --base "$base" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            --source-root "${{ inputs.source-root }}" \
            --out "$RUNNER_TEMP/javadoc-diff"
      # Direct `javadoc`, not the Maven plugin: the plugin's unit is a module and rule 11's unit is a
      # file. The flags reproduce what the `javadoc-gate` profile configures, because the two halves
      # have to agree on what a finding is:
      #   -Xdoclint:all              <doclint>all</doclint>
      #   warnings counted as errors <failOnWarnings>true</failOnWarnings>; javadoc has no -Werror,
      #                              so the log is counted rather than the exit code
      #   -tag apiNote/implSpec/implNote  the profile's <tags>. Without them javadoc reports every
      #                              correctly written contract comment as "unknown tag. Unregistered
      #                              custom tag?" — an error, on the files most likely to be right.
      #   default visibility         the profile sets no <show>, so the plugin's default (protected)
      #                              applies and `-private` would gate more than the whole-module half
      # -Xmaxwarns lifts javadoc's default cap of 100, which otherwise truncates the worklist at the
      # point where it stops being a worklist.
      - name: Javadoc on changed files only
        if: ${{ !cancelled() && steps.reactor.outcome == 'success' && steps.targets.outputs.any == 'true' }}
        run: |
          set -uo pipefail
          failed=0
          for mf in "$RUNNER_TEMP"/javadoc-diff/*.module; do
            n="${mf%.module}"; module=$(cat "$mf")
            ${{ steps.mvn.outputs.cmd }} -q -B -ntp -pl "$module" -DskipTests -Dcheckstyle.skip=true \
              -Dmdep.outputFile="$RUNNER_TEMP/cp.txt" dependency:build-classpath
            echo "::group::javadoc — $module ($(wc -l < "$n.files") changed file(s))"
            javadoc -Xdoclint:all -Xmaxwarns 10000 -Xmaxerrs 10000 -quiet \
              -tag 'apiNote:a:API Note:' \
              -tag 'implSpec:a:Implementation Requirements:' \
              -tag 'implNote:a:Implementation Note:' \
              --release "${{ inputs.java-version }}" \
              -cp "$(cat "$RUNNER_TEMP/cp.txt"):$module/target/classes" \
              -d "$RUNNER_TEMP/javadoc-out/$(basename "$n")" "@$n.files" 2>&1 | tee "$n.log" || true
            echo "::endgroup::"
            found=$(grep -cE ':[0-9]+: (error|warning):' "$n.log" || true)
            if [ "$found" -gt 0 ]; then
              echo "::error::$module — $found Javadoc finding(s) on files this pull request changed (javadoc-conventions.md rule 11)"
              failed=1
            else
              echo "$module — clean"
            fi
          done
          exit $failed

      # ---------------------------------------------------------------- Checkstyle half
      # `com.puppycrawl.tools.checkstyle.Main` from the pinned engine, not maven-checkstyle-plugin.
      # Three problems go away with the plugin: it decides the engine version (see the engine pom),
      # an explicit <configLocation> in a repository's pom silently overrides
      # `-Dcheckstyle.config.location` so the gate can run the wrong ruleset without saying so, and
      # its plugin dependencies are resolved from repositories rather than the reactor.
      #
      # These steps need no reactor at all — Checkstyle parses source. So they report even when the
      # build is broken, which is when a worklist is most useful: measured while adopting this gate on
      # exeris-kernel, doclint stopped the run at 62 errors on `exeris-kernel-spi` while this half had
      # 644 on the same module that no run had ever printed. Every module is audited before the step
      # fails, so one red module does not hide the rest.
      #
      # The CLI's exit status is the number of ERROR-severity findings; warnings print and do not
      # fail. That is what keeps rule 12's history check advisory, as ADR-085 §J.31 says it is.
      - name: Checkstyle Javadoc modules on fully gated modules
        if: ${{ !cancelled() && steps.cs.outcome == 'success' && inputs.modules != '' }}
        run: |
          set -uo pipefail
          failed=0
          IFS=',' read -ra mods <<< "${{ inputs.modules }}"
          for module in "${mods[@]}"; do
            module="$(echo "$module" | tr -d '[:space:]')"; [ -n "$module" ] || continue
            src="$module/${{ inputs.source-root }}"
            if [ ! -d "$src" ]; then
              echo "::error::$module has no $src — check the module list or the source-root input"
              failed=1; continue
            fi
            echo "::group::checkstyle — $module"
            java -cp "$(cat "$RUNNER_TEMP/cs-cp.txt")" com.puppycrawl.tools.checkstyle.Main \
              -c "$GITHUB_WORKSPACE/.guardrails/java/checkstyle-javadoc.xml" "$src" || failed=1
            echo "::endgroup::"
          done
          exit $failed
      - name: Checkstyle Javadoc modules on changed files only
        if: ${{ !cancelled() && steps.cs.outcome == 'success' && steps.targets.outputs.any == 'true' }}
        run: |
          set -uo pipefail
          failed=0
          for mf in "$RUNNER_TEMP"/javadoc-diff/*.module; do
            n="${mf%.module}"; module=$(cat "$mf")
            mapfile -t files < "$n.files"
            echo "::group::checkstyle — $module (${#files[@]} changed file(s))"
            java -cp "$(cat "$RUNNER_TEMP/cs-cp.txt")" com.puppycrawl.tools.checkstyle.Main \
              -c "$GITHUB_WORKSPACE/.guardrails/java/checkstyle-javadoc.xml" "${files[@]}" || failed=1
            echo "::endgroup::"
          done
          exit $failed
