# Exeris markdownlint configuration — docs-style-guide.md rule 1; warning-level lint (ADR-085 §J.32).
default: true
MD013: false            # line length — narrative docs wrap where they wrap
MD024:                  # duplicate headings allowed when not siblings (ADR sections repeat "Pros:")
  siblings_only: true
MD033:                  # inline HTML allow-list
  allowed_elements: [br, sub, sup, details, summary, kbd]
MD041: false            # first line need not be an H1 (frontmatter comes first)
MD036: false            # bold-as-heading is used for ADR table labels
MD025: false            # single H1 — H1 plus frontmatter title is the sanctioned pair
MD029:                  # ordered-list numbering style
  style: ordered
MD034: false            # bare URLs appear in reference lists
MD046:                  # code block style
  style: fenced
