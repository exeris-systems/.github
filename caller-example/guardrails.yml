# Copy to <repo>/.github/workflows/guardrails.yml — the whole per-repo footprint of ADR-085 §C.11.
name: guardrails
on:
  pull_request:
    # labeled/unlabeled matter: adr-conventions rule 9 requires the `adr` label on a PR that
    # amends an ADR, so adding the label after a red run has to re-run the gate.
    types: [opened, edited, synchronize, ready_for_review, labeled, unlabeled]
concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: true
# A called workflow can only narrow the caller's permissions, never raise them. If the
# repository's default token grants `pull-requests: none`, the gates refuse to start with
# "requesting 'pull-requests: read', but is only allowed 'pull-requests: none'".
permissions:
  contents: read
  pull-requests: read

jobs:
  docs:
    uses: exeris-systems/.github/.github/workflows/docs-lint.yml@main
    with:
      mode: ramp                # switch to strict per repo once the frontmatter backfill has landed
      section-check: false      # enable after subsystem/module pages carry the required sections
      # extra-paths: "adr rfc *.md"   # exeris-docs only — its records live at the repo root
  commits:
    uses: exeris-systems/.github/.github/workflows/commit-lint.yml@main
  pr-body:
    uses: exeris-systems/.github/.github/workflows/pr-body-check.yml@main
  # javadoc:                    # JVM repos with a gated module only
  #   uses: exeris-systems/.github/.github/workflows/javadoc-gate.yml@main
  #   with: { modules: "exeris-kernel-spi" }
